    function deleteQuestionFromPool(examId, idx) {
      const adminExams = getAdminExaminations();
      if (!adminExams.some(e => e.id === examId)) {
        showToastNotification("⚠️ Examination not found.");
        return;
      }

      const pool = masterQuestionPools[examId];
      if (!pool || !pool[idx]) {
        showToastNotification("⚠️ Question not found.");
        return;
      }

      const q = pool[idx];
      const snippet = q.text.length > 55 ? q.text.substring(0, 55) + '...' : q.text;
      if (!confirm(`Are you sure you want to delete Question #${idx + 1} from ${examId}?\n\n"${snippet}"\n\nThis will remove it from the active examination pool immediately.`)) {
        return;
      }

      const deletedItem = pool.splice(idx, 1)[0];
      const cleanDeletedText = (deletedItem.text || '').replace(/^\d+\.\s*/, '').trim().toLowerCase();

      // Immediately synchronize student interface active questions & counts
      if (allExams[examId]) {
        if (allExams[examId].questions && allExams[examId].questions.length > 0) {
          allExams[examId].questions = allExams[examId].questions.filter(sq => {
            const cleanStudentText = (sq.text || '').replace(/^\d+\.\s*/, '').trim().toLowerCase();
            return cleanStudentText !== cleanDeletedText;
          });
          // Re-index student questions sequentially 1..N
          allExams[examId].questions.forEach((sq, qIdx) => {
            sq.text = `${qIdx + 1}. ${sq.text.replace(/^\d+\.\s*/, '')}`;
          });
          allExams[examId].totalQuestions = allExams[examId].questions.length;
        } else {
          allExams[examId].totalQuestions = pool.length;
        }
      }

      // Clean up student answers if question index is now out of range
      if (state.answers && state.answers[examId]) {
        const totalQ = (allExams[examId] && allExams[examId].questions) ? allExams[examId].questions.length : pool.length;
        Object.keys(state.answers[examId]).forEach(ansIdx => {
          if (parseInt(ansIdx, 10) >= totalQ) {
            delete state.answers[examId][ansIdx];
          }
        });
      }

      if (state.currentQIndex && allExams[examId] && allExams[examId].questions) {
        if (state.currentQIndex >= allExams[examId].questions.length) {
          state.currentQIndex = Math.max(0, allExams[examId].questions.length - 1);
        }
      }

      saveExamsToStorage();
      saveQuestionPoolsToStorage();

      // Synchronize deletion with SQLite database table 'questions'
      try {
        if (deletedItem && deletedItem.id) {
          fetch(`/api/questions?id=${deletedItem.id}&quiz_id=${encodeURIComponent(examId)}`, {
            method: 'DELETE'
          }).catch(() => { });
        }
      } catch (e) { }

      showToastNotification(`🗑️ Question #${idx + 1} deleted from ${examId}. Student interface synchronized! (${pool.length} pool questions remaining)`);

      const container = document.getElementById('appViewport');
      renderAdminDashboard(container);
    }

    // Function to permanently delete examinations from Administrator Interface
    function deleteAllExams() {
      const adminExams = getAdminExaminations();
      const count = adminExams.length;
      if (count === 0) {
        showToastNotification("ℹ️ There are no active examinations to delete.");
        return;
      }
      if (!confirm(`Are you sure you want to permanently delete all ${count} examination(s)?\n\nThis will remove the examinations from both Administrator and Student interfaces.`)) {
        return;
      }

      const adminId = state.user ? (state.user.id || state.user.username) : '';
      const myExamIds = adminExams.map(e => e.id);
      try {
        const deletedExamIds = JSON.parse(localStorage.getItem('online_exam_deleted_exam_ids') || '[]');
        myExamIds.forEach(id => {
          if (!deletedExamIds.includes(id)) deletedExamIds.push(id);
          delete allExams[id];

          if (state.answers) delete state.answers[id];
          if (state.remainingSeconds) delete state.remainingSeconds[id];
          if (state.examAttempts) delete state.examAttempts[id];

          // Synchronize deletion with SQLite database

            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id, admin_id: adminId })
          }).catch(() => { });
        });
        localStorage.setItem('online_exam_deleted_exam_ids', JSON.stringify(deletedExamIds));
        saveExamsToStorage();
        saveQuestionPoolsToStorage();
      } catch (e) {
        console.warn(e);
      }

      state.selectedExamId = '';
      state.adminSelectedExam = '';

      if (typeof renderSidebarNavigation === 'function') {
        renderSidebarNavigation();
      }

      showToastNotification(`🗑️ Successfully deleted your ${count} examination(s).`);

      renderAdminDashboard(container);
    }

    function deleteExam(examId) {
      const exam = allExams[examId];
      if (!exam) {
        showToastNotification("⚠️ Examination not found.");
        return;
      }

      const adminExams = getAdminExaminations();
      if (!adminExams.some(e => e.id === examId)) {
        showToastNotification("⚠️ Examination not found in active registry.");
        return;
      }

      const confirmed = confirm(`Are you sure you want to permanently delete examination:\n\n"${exam.title}" (${exam.id})?\n\nThis will remove the course examination and its question pool from both Administrator and Student portals.`);
      if (!confirmed) return;

      const examTitle = exam.title;
      const adminId = state.user ? (state.user.id || state.user.username) : '';

      // 1. Remove from in-memory allExams and masterQuestionPools
      delete allExams[examId];
      if (masterQuestionPools[examId]) {
        delete masterQuestionPools[examId];
      }

      // 2. Persist deletion in localStorage so it NEVER reappears on refresh
      try {
        const deletedExamIds = JSON.parse(localStorage.getItem('online_exam_deleted_exam_ids') || '[]');
        if (!deletedExamIds.includes(examId)) {
          deletedExamIds.push(examId);
          localStorage.setItem('online_exam_deleted_exam_ids', JSON.stringify(deletedExamIds));
        }
        saveExamsToStorage();
        saveQuestionPoolsToStorage();
      } catch (e) {
        console.warn("Could not persist exam deletion to localStorage:", e);
      }

      // Synchronize deletion with SQLite database table 'quizzes'
      try {
        fetch('/api/exams/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: examId, admin_id: adminId })
        }).catch(() => { });
      } catch (e) { }

      // 3. Clean up student session state
      if (state.answers && state.answers[examId]) {
        delete state.answers[examId];
      }
      if (state.remainingSeconds && state.remainingSeconds[examId]) {
        delete state.remainingSeconds[examId];
      }
      if (state.examAttempts && state.examAttempts[examId]) {
        delete state.examAttempts[examId];
      }

      // 4. Fallback selected exam if deleted exam was currently selected
      const remainingIds = Object.keys(allExams);
      if (state.selectedExamId === examId) {
        state.selectedExamId = remainingIds.length > 0 ? remainingIds[0] : '';
      }
      if (state.adminSelectedExam === examId) {
        state.adminSelectedExam = remainingIds.length > 0 ? remainingIds[0] : '';
      }

      if (typeof renderSidebarNavigation === 'function') {
        renderSidebarNavigation();
      }
      showToastNotification(`🗑️ Examination "${examTitle}" (${examId}) deleted permanently from both Administrator and Student interfaces.`);

      const container = document.getElementById('appViewport');
      if (state.currentView === 'admin-dashboard' || state.currentView === 'admin-exams') {
        state.adminActiveTab = 'quizzes';
        renderAdminDashboard(container);
      } else if (state.currentView === 'dashboard') {
        renderDashboard(container);
      } else if (state.currentView === 'my-exams') {
        renderMyExamsView(container);
      } else {
        renderAdminDashboard(container);
      }
    }

    // =========================================================================
    // 8. AI WEBCAM PROCTORING & ANTI-CHEATING ENGINE
    // =========================================================================
    // =========================================================================
    // 8. AI WEBCAM PROCTORING & ANTI-CHEATING ENGINE (STRICT LIVE HARDWARE ONLY)
    // =========================================================================
    let analysisCanvas = null;
    let analysisCtx = null;
    let turnLeftCounter = 0;
    let turnRightCounter = 0;
    let lookUpCounter = 0;
    let lookDownCounter = 0;
    let multiFaceCounter = 0;
    let consecutiveNoFace = 0;
    let consecutiveDarkFrames = 0;
    let lastPose = 'CENTERED';
    let lastDetectedFaceBox = null;
    let lastDetectedFaceBoxes = [];
    let lastLandmarks = null;
    let baselinePose = null;
    let calibrationFrames = 0;
    let proctorAudioCtx = null;

    function getProctorAudioCtx() {
      try {
        if (!proctorAudioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            proctorAudioCtx = new AudioContextClass();
          }
        }
        if (proctorAudioCtx && proctorAudioCtx.state === 'suspended') {
          proctorAudioCtx.resume().catch(() => { });
        }
      } catch (e) {
        console.warn("AudioContext init error:", e);
      }
      return proctorAudioCtx;
    }

    // Auto-resume audio context on user interaction so warning beeps always play sound
    if (typeof window !== 'undefined') {
      ['click', 'keydown', 'touchstart'].forEach(evt => {
        window.addEventListener(evt, () => { getProctorAudioCtx(); }, { passive: true });
      });
    }

    async function initProctorWebcam() {
      const video = document.getElementById('proctorVideo');
      const overlay = document.getElementById('proctorOverlayCanvas');
      if (!video) return;

      getProctorAudioCtx();

      state.proctorLogs = state.proctorLogs || [];
      state.isDisqualified = false;
      state.proctorStrikes = 0;
      state.proctorIntegrityPct = 100;
      baselinePose = null;
      calibrationFrames = 0;
      state.calibAccum = null;
      turnLeftCounter = 0;
      turnRightCounter = 0;
      lookUpCounter = 0;
      lookDownCounter = 0;
      multiFaceCounter = 0;
      consecutiveNoFace = 0;
      consecutiveDarkFrames = 0;
      lastPose = 'CENTERED';
      lastDetectedFaceBox = null;
      lastDetectedFaceBoxes = [];
      lastLandmarks = null;

      logProctorEvent("info", "Webcam initializing & sensor warming up...");

      if (overlay) {
        overlay.width = 340;
        overlay.height = 195;
      }

      // Configure video element for reliable cross-browser inline playback
      video.muted = true;
      video.playsInline = true;
      video.setAttribute('playsinline', '');
      video.setAttribute('muted', '');
      video.setAttribute('autoplay', '');

      // Remove any prior error overlay if present
      const oldErr = document.getElementById('proctorCamError');
      if (oldErr) oldErr.remove();

      // Update badge to Connecting state
      const camBadge = document.getElementById('proctorCamBadge');
      if (camBadge) {
        camBadge.innerHTML = '⏳ Connecting Camera...';
        camBadge.style.color = '#fbbf24';
        camBadge.style.borderColor = 'rgba(251, 191, 36, 0.4)';
        camBadge.style.background = 'rgba(251, 191, 36, 0.12)';
      }

      // If active stream already exists, reuse it directly
      if (state.proctorStream && state.proctorStream.active) {
        video.srcObject = state.proctorStream;
        video.style.display = 'block';
        try { await video.play(); } catch (e) { }
        if (camBadge) {
          camBadge.innerHTML = '📹 Live Camera';
          camBadge.style.color = '#34d399';
          camBadge.style.borderColor = 'rgba(16, 185, 129, 0.3)';
          camBadge.style.background = 'rgba(16, 185, 129, 0.12)';
        }
        updateProctorStatus('NORMAL', "Live Webcam Active • Calibrating...");
        logProctorEvent("success", "Live hardware webcam stream linked & operational");
        attachProctorSecurityListeners();
        startProctorAnalysisLoop();
        return;
      }

      // Connect to hardware camera with resilient 3-tier fallback
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("getUserMedia not supported in this browser or environment");
        }

        let stream = null;
        // Tier 1: Ideal user-facing constraints
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              width: { ideal: 640 },
              height: { ideal: 480 },
              facingMode: 'user'
            },
            audio: false
          });
        } catch (strictErr) {
          console.warn("Tier 1 camera constraints failed, attempting Tier 2 resolution constraints...", strictErr);
          // Tier 2: Without facingMode (many Windows desktop webcams reject facingMode)
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { width: { ideal: 640 }, height: { ideal: 480 } },
              audio: false
            });
          } catch (resErr) {
            console.warn("Tier 2 resolution constraints failed, attempting Tier 3 simple video: true...", resErr);
            // Tier 3: Bare generic video
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          }
        }

        const tracks = stream ? stream.getVideoTracks() : [];
        if (!tracks || tracks.length === 0) {
          throw new Error("No active video tracks found on camera device");
        }

        state.proctorStream = stream;
        video.srcObject = stream;
        video.style.display = 'block';

        await new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play().then(resolve).catch(resolve);
          };
          setTimeout(resolve, 800);
        });

        if (camBadge) {
          camBadge.innerHTML = '📹 Live Camera';
          camBadge.style.color = '#34d399';
          camBadge.style.borderColor = 'rgba(16, 185, 129, 0.3)';
          camBadge.style.background = 'rgba(16, 185, 129, 0.12)';
        }

        updateProctorStatus('NORMAL', "Live Webcam Active • Calibrating...");
        logProctorEvent("success", "Live hardware webcam stream linked & active");
        attachProctorSecurityListeners();
        startProctorAnalysisLoop();
      } catch (err) {
        console.warn("Hardware camera unavailable or blocked:", err);
        video.style.display = 'none';

        if (camBadge) {
          camBadge.innerHTML = '⚠️ Camera Offline';
          camBadge.style.color = '#ef4444';
          camBadge.style.borderColor = 'rgba(239, 68, 68, 0.35)';
          camBadge.style.background = 'rgba(239, 68, 68, 0.15)';
        }

        let specificTitle = "Webcam Not Detected";
        let specificHint = "Live camera proctoring is mandatory for this exam. Please connect a webcam and ensure browser camera permissions are enabled.";

        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          specificTitle = "Camera Permission Denied";
          specificHint = "Your browser or system has blocked camera access for this page. Click the camera/lock icon in your browser URL bar or allow camera in browser settings.";
        } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
          specificTitle = "No Camera Hardware Found";
          specificHint = "No webcam device was found on your system. Please plug in an external USB webcam or enable your laptop camera.";
        } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
          specificTitle = "Camera In Use By Another App";
          specificHint = "The camera is currently in use by another application (Zoom, Teams, Discord, Skype, etc.). Please close other apps and click retry.";
        } else if (window.location.protocol === 'file:') {
          specificTitle = "Browser file:// Camera Restriction";
          specificHint = "Modern browsers block camera access on local file:// files. Please run via local web server (run_app.bat) or allow camera permissions.";
        }

        const container = document.getElementById('proctorVideoContainer');
        if (container && !document.getElementById('proctorCamError')) {
          const errDiv = document.createElement('div');
          errDiv.id = 'proctorCamError';
          errDiv.style.cssText = `
            position: absolute; inset: 0; z-index: 10;
            background: rgba(10, 15, 30, 0.96);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 16px; text-align: center; color: #f87171;
          `;
          errDiv.innerHTML = `
            <div style="font-size: var(--fs-3xl); margin-bottom: 6px;">📹⚠️</div>
            <div style="font-weight: 800; font-size: var(--fs-base); color: #fff; margin-bottom: 4px;">${specificTitle}</div>
            <div style="font-size: var(--fs-xs); color: #94a3b8; margin-bottom: 16px; line-height: 1.4; max-width: 280px;">
              ${specificHint}
            </div>
            <button class="btn-resume-glow" style="padding: 9px 22px; font-size: var(--fs-sm);" onclick="initProctorWebcam()">
              🔄 Grant / Retry Camera
            </button>
          `;
          container.appendChild(errDiv);
        }

        updateProctorStatus('LOOKING_AWAY', "Camera Required: Please allow camera permissions");
        logProctorEvent("danger", `Webcam access failed: ${err.message || specificTitle}`);
      }
    }

    function stopProctorStreamTracks() {
      if (state.proctorStream) {
        state.proctorStream.getTracks().forEach(t => t.stop());
        state.proctorStream = null;
      }
    }

    function stopProctoringSystem() {
      stopProctorStreamTracks();
      if (state.proctorAnalysisTimer) {
        clearInterval(state.proctorAnalysisTimer);
        state.proctorAnalysisTimer = null;
      }
      if (state.proctorOverlayAnim) {
        cancelAnimationFrame(state.proctorOverlayAnim);
        state.proctorOverlayAnim = null;
      }
    }

    function startProctorAnalysisLoop() {
      if (state.proctorAnalysisTimer) clearInterval(state.proctorAnalysisTimer);
      state.proctorAnalysisTimer = setInterval(analyzeProctorFrame, 200);

      function loopOverlay() {
        if (state.currentView === 'exam-room') {
          const overlay = document.getElementById('proctorOverlayCanvas');
          const video = document.getElementById('proctorVideo');
          if (overlay) drawProctorOverlay(overlay, video);
          state.proctorOverlayAnim = requestAnimationFrame(loopOverlay);
        }
      }
      loopOverlay();
    }

    function drawProctorOverlay(canvas, video) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const isNormal = (lastPose === 'CENTERED');
      const isWarn = (lastPose === 'TURN_LEFT' || lastPose === 'TURN_RIGHT' || lastPose === 'LOOK_UP' || lastPose === 'LOOK_DOWN');
      const boxColor = isNormal ? '#10b981' : isWarn ? '#f59e0b' : '#ef4444';

      const scaleX = canvas.width / 160;
      const scaleY = canvas.height / 120;

      // Draw mirrored graphics matching the mirrored camera stream
      ctx.save();
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);

      const boxesToDraw = (lastDetectedFaceBoxes && lastDetectedFaceBoxes.length > 0)
        ? lastDetectedFaceBoxes
        : (lastDetectedFaceBox ? [lastDetectedFaceBox] : null);

      if (boxesToDraw && boxesToDraw.length > 0) {
        boxesToDraw.forEach(box => {
          const bx = Math.max(0, box.x * scaleX);
          const by = Math.max(0, box.y * scaleY);
          const bw = Math.min(canvas.width - bx, box.w * scaleX);
          const bh = Math.min(canvas.height - by, box.h * scaleY);
          const isMulti = (boxesToDraw.length > 1);

          ctx.strokeStyle = isMulti ? '#ef4444' : boxColor;
          ctx.lineWidth = isMulti ? 3.0 : 2.5;
          const cornerLen = Math.min(22, bw * 0.22);

          // Top-Left
          ctx.beginPath(); ctx.moveTo(bx, by + cornerLen); ctx.lineTo(bx, by); ctx.lineTo(bx + cornerLen, by); ctx.stroke();
          // Top-Right
          ctx.beginPath(); ctx.moveTo(bx + bw - cornerLen, by); ctx.lineTo(bx + bw); ctx.lineTo(bx + bw, by + cornerLen); ctx.stroke();
          // Bottom-Left
          ctx.beginPath(); ctx.moveTo(bx, by + bh - cornerLen); ctx.lineTo(bx, by + bh); ctx.lineTo(bx + cornerLen, by + bh); ctx.stroke();
          // Bottom-Right
          ctx.beginPath(); ctx.moveTo(bx + bw - cornerLen, by + bh); ctx.lineTo(bx + bw); ctx.lineTo(bx + bw, by + bh - cornerLen); ctx.stroke();
        });
      }

      // Facial landmark dots
      if (lastLandmarks) {
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(lastLandmarks.x * scaleX, lastLandmarks.y * scaleY, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();

      // Draw unmirrored HUD tags so text reads left-to-right cleanly
      ctx.fillStyle = isNormal ? 'rgba(16, 185, 129, 0.94)' : isWarn ? 'rgba(245, 158, 11, 0.94)' : 'rgba(239, 68, 68, 0.94)';
      const hudWidth = (lastPose === 'MULTIPLE_FACES' || lastPose === 'TURN_RIGHT' || lastPose === 'TURN_LEFT') ? 220 : 192;
      ctx.fillRect(8, 8, hudWidth, 22);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 10px monospace';

      const label = isNormal ? `● CENTERED • VERIFIED` :
        lastPose === 'MULTIPLE_FACES' ? `🚨 MULTIPLE PEOPLE DETECTED` :
          lastPose === 'TURN_LEFT' ? `⚠️ HEAD TURNED LEFT` :
            lastPose === 'TURN_RIGHT' ? `⚠️ HEAD TURNED RIGHT` :
              lastPose === 'LOOK_UP' ? `⚠️ LOOKING UP` :
                lastPose === 'LOOK_DOWN' ? `⚠️ LOOKING DOWN` :
                  lastPose === 'NO_FACE' ? `🚨 NO FACE DETECTED` : `⚠️ ${lastPose}`;
      ctx.fillText(label, 14, 23);

      // Head Orientation HUD Compass (Top Right Corner)
      const compassX = canvas.width - 45;
      const compassY = 30;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.beginPath();
      ctx.arc(compassX, compassY, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Crosshairs
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.beginPath();
      ctx.moveTo(compassX - 13, compassY); ctx.lineTo(compassX + 13, compassY);
      ctx.moveTo(compassX, compassY - 13); ctx.lineTo(compassX, compassY + 13);
      ctx.stroke();

      // Compass labels
      ctx.fillStyle = '#94a3b8';
      ctx.font = '7px sans-serif';
      ctx.fillText('U', compassX - 2.5, compassY - 14);
      ctx.fillText('D', compassX - 2.5, compassY + 19);
      ctx.fillText('L', compassX - 19, compassY + 2.5);
      ctx.fillText('R', compassX + 14, compassY + 2.5);

      // Dynamic orientation vector dot
      let dotX = compassX;
      let dotY = compassY;
      if (lastPose === 'TURN_RIGHT') dotX += 11;
      if (lastPose === 'TURN_LEFT') dotX -= 11;
      if (lastPose === 'LOOK_UP') dotY -= 11;
      if (lastPose === 'LOOK_DOWN') dotY += 11;

      ctx.fillStyle = boxColor;
      ctx.beginPath();
      ctx.arc(dotX, dotY, 4.5, 0, Math.PI * 2);
      ctx.fill();
    }

    async function analyzeProctorFrame() {
      if (state.currentView !== 'exam-room') return;
      if (state.isDisqualified) return;

      const video = document.getElementById('proctorVideo');
      const overlay = document.getElementById('proctorOverlayCanvas');
      if (!video || video.readyState < 2 || video.videoWidth === 0) return;

      const w = 160;
      const h = 120;
      if (!analysisCanvas) {
        analysisCanvas = document.createElement('canvas');
        analysisCanvas.width = w;
        analysisCanvas.height = h;
        analysisCtx = analysisCanvas.getContext('2d', { willReadFrequently: true });
      }

      analysisCtx.drawImage(video, 0, 0, w, h);
      const imgData = analysisCtx.getImageData(0, 0, w, h);
      const data = imgData.data;

      // 1. Dark camera / covered lens detection
      let totalLuma = 0;
      for (let i = 0; i < data.length; i += 4) {
        totalLuma += (data[i] + data[i + 1] + data[i + 2]) / 3;
      }
      const avgLuma = totalLuma / (w * h);
      if (avgLuma < 12) {
        consecutiveDarkFrames++;
        const inGracePeriod = (Date.now() - (state.examStartTime || 0) < 6000);
        if (consecutiveDarkFrames >= 14 && !inGracePeriod) {
          handleViolation('CAMERA_BLOCKED', "Webcam lens blocked or lighting pitch dark! Camera must remain clear.");
          consecutiveDarkFrames = 5;
        } else {
          updateProctorStatus('LOOKING_AWAY', inGracePeriod ? "Camera sensor adjusting..." : "Camera obscured or low lighting detected");
        }
        lastPose = 'NO_FACE';
        lastDetectedFaceBox = null;
        lastDetectedFaceBoxes = [];
        return;
      }
      consecutiveDarkFrames = 0;

      // 2. Multi-Person & High-Precision Face Detection
      let detectedBox = null;
      let detectedBoxes = [];
      let featCenter = null;
      let multiFacesDetected = false;

      // Check Native Chrome/Edge FaceDetector if available
      if (window.FaceDetector && !state._disableNativeDetector) {
        try {
          if (!state.nativeFaceDetector) {
            state.nativeFaceDetector = new window.FaceDetector({ fastMode: true, maxDetectedFaces: 4 });
          }
          const nativeFaces = await state.nativeFaceDetector.detect(video);
          if (nativeFaces && nativeFaces.length > 0) {
            const scaleX = w / video.videoWidth;
            const scaleY = h / video.videoHeight;
            detectedBoxes = nativeFaces.map(f => {
              const bb = f.boundingBox;
              return {
                x: bb.x * scaleX,
                y: bb.y * scaleY,
                w: bb.width * scaleX,
                h: bb.height * scaleY
              };
            });
            if (nativeFaces.length > 1) {
              multiFacesDetected = true;
            }
            detectedBox = detectedBoxes[0];
            const f = nativeFaces[0];
            if (f.landmarks && f.landmarks.length > 0) {
              const nose = f.landmarks.find(l => l.type === 'nose');
              if (nose && nose.locations && nose.locations.length > 0) {
                featCenter = {
                  x: nose.locations[0].x * scaleX,
                  y: nose.locations[0].y * scaleY
                };
              }
            }
          }
        } catch (e) {
          state._disableNativeDetector = true;
        }
      }

      // Pure JS Computer Vision Engine with Multi-Person Column Histogram Clustering
      if (!detectedBox) {
        const yStart = Math.floor(h * 0.08);
        const yEnd = Math.floor(h * 0.74);
        const xStart = Math.floor(w * 0.06);
        const xEnd = Math.floor(w * 0.94);

        const colSkin = new Array(w).fill(0);
        const colMinY = new Array(w).fill(h);
        const colMaxY = new Array(w).fill(0);

        for (let y = yStart; y < yEnd; y++) {
          for (let x = xStart; x < xEnd; x++) {
            const idx = (y * w + x) * 4;
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];
            const yLuma = 0.299 * r + 0.587 * g + 0.114 * b;
            const cb = -0.1687 * r - 0.3313 * g + 0.5 * b + 128;
            const cr = 0.5 * r - 0.4187 * g - 0.0813 * b + 128;

            // Genuine human skin filter in YCbCr and RGB color space
            const isSkin = (yLuma >= 28 && yLuma <= 245) &&
              (cr >= 133 && cr <= 178) &&
              (cb >= 78 && cb <= 130) &&
              (r > g && g >= b - 12) &&
              (r - g >= 8 && r - g <= 62);

            if (isSkin) {
              colSkin[x]++;
              if (y < colMinY[x]) colMinY[x] = y;
              if (y > colMaxY[x]) colMaxY[x] = y;
            }
          }
        }

        // Smooth column histogram to eliminate single-column noise
        const smoothCol = new Array(w).fill(0);
        for (let x = xStart; x < xEnd; x++) {
          const prev = colSkin[x - 1] || 0;
          const curr = colSkin[x];
          const next = colSkin[x + 1] || 0;
          smoothCol[x] = (prev + curr * 2 + next) / 4;
        }

        // Detect distinct person clusters across horizontal columns
        const clusters = [];
        let inCluster = false;
        let cMinX = 0, cMaxX = 0, cSkinCount = 0, cMinY = h, cMaxY = 0;
        let gapCount = 0;

        for (let x = xStart; x < xEnd; x++) {
          if (smoothCol[x] >= 3) {
            if (!inCluster) {
              inCluster = true;
              cMinX = x;
              cMaxX = x;
              cSkinCount = smoothCol[x];
              cMinY = colMinY[x];
              cMaxY = colMaxY[x];
              gapCount = 0;
            } else {
              cMaxX = x;
              cSkinCount += smoothCol[x];
              if (colMinY[x] < cMinY) cMinY = colMinY[x];
              if (colMaxY[x] > cMaxY) cMaxY = colMaxY[x];
              gapCount = 0;
            }
          } else {
            if (inCluster) {
              gapCount++;
              // If a gap of 6 or more columns without skin pixels occurs, terminate cluster
              if (gapCount >= 6 || x === xEnd - 1) {
                const cWidth = cMaxX - cMinX;
                const cHeight = cMaxY - cMinY;
                if (cWidth >= 13 && cHeight >= 14 && cSkinCount >= 55) {
                  clusters.push({
                    x: cMinX,
                    y: cMinY,
                    w: cWidth,
                    h: cHeight,
                    skinCount: cSkinCount,
                    centerX: (cMinX + cMaxX) / 2
                  });
                }
                inCluster = false;
                gapCount = 0;
              }
            }
          }
        }

        if (clusters.length > 0) {
          // Sort clusters by skin pixel count descending (largest face first = candidate)
          clusters.sort((a, b) => b.skinCount - a.skinCount);
          detectedBoxes = clusters.map(c => ({
            x: Math.max(0, c.x - 2),
            y: Math.max(0, c.y - 2),
            w: Math.min(w - c.x, c.w + 4),
            h: Math.min(h - c.y, c.h + 4)
          }));
          detectedBox = detectedBoxes[0];
          if (detectedBoxes.length > 1) {
            multiFacesDetected = true;
          }

          // Extract dark facial landmarks (eyes, pupils, nose) within primary face
          let faceLumaSum = 0;
          let faceLumaSamples = 0;
          const fX0 = Math.floor(detectedBox.x);
          const fY0 = Math.floor(detectedBox.y);
          const fW0 = Math.floor(detectedBox.w);
          const fH0 = Math.floor(detectedBox.h);

          for (let fy = fY0; fy < fY0 + fH0; fy += 2) {
            for (let fx = fX0; fx < fX0 + fW0; fx += 2) {
              if (fx >= 0 && fx < w && fy >= 0 && fy < h) {
                const fidx = (fy * w + fx) * 4;
                faceLumaSum += (data[fidx] + data[fidx + 1] + data[fidx + 2]) / 3;
                faceLumaSamples++;
              }
            }
          }
          const localFaceLuma = faceLumaSamples > 0 ? (faceLumaSum / faceLumaSamples) : avgLuma;
          const darkFeatThresh = Math.min(localFaceLuma * 0.72, 105);

          const featYStart = Math.floor(detectedBox.y + detectedBox.h * 0.16);
          const featYEnd = Math.floor(detectedBox.y + detectedBox.h * 0.64);
          const featXStart = Math.floor(detectedBox.x + detectedBox.w * 0.14);
          const featXEnd = Math.floor(detectedBox.x + detectedBox.w * 0.86);

          let featCount = 0;
          let featSumX = 0;
          let featSumY = 0;

          for (let fy = featYStart; fy < featYEnd; fy++) {
            for (let fx = featXStart; fx < featXEnd; fx++) {
              if (fx >= 0 && fx < w && fy >= 0 && fy < h) {
                const fidx = (fy * w + fx) * 4;
                const fluma = (data[fidx] + data[fidx + 1] + data[fidx + 2]) / 3;
                if (fluma < darkFeatThresh) {
                  featCount++;
                  featSumX += fx;
                  featSumY += fy;
                }
              }
            }
          }

          if (featCount >= 8) {
            featCenter = {
              x: featSumX / featCount,
              y: featSumY / featCount
            };
          }
        }
      }

      // Update overlay bounding boxes
      lastDetectedFaceBoxes = detectedBoxes;
      lastDetectedFaceBox = detectedBox;
      lastLandmarks = featCenter;

      // 3. Multi-Person Detection Strike Handling
      if (multiFacesDetected) {
        multiFaceCounter++;
        lastPose = 'MULTIPLE_FACES';
        updateProctorStatus('MULTIPLE_FACES', "🚨 Multiple people detected in webcam view!");
        if (multiFaceCounter >= 2) { // 2 sustained frames (~400ms)
          handleViolation('MULTIPLE_FACES', "Multiple individuals detected in examination frame! Only the candidate may be present.");
          multiFaceCounter = 0;
        }
        return;
      }
      multiFaceCounter = Math.max(0, multiFaceCounter - 1);

      // 4. Missing Face Handling
      if (!detectedBox) {
        consecutiveNoFace++;
        lastDetectedFaceBox = null;
        lastDetectedFaceBoxes = [];
        lastPose = 'NO_FACE';
        const inGracePeriod = (Date.now() - (state.examStartTime || 0) < 6000);
        if (consecutiveNoFace >= 14 && !inGracePeriod) { // ~2.8s sustained after warmup
          handleViolation('NO_FACE', "Candidate face not detected! Please face the webcam.");
          consecutiveNoFace = 6;
        } else {
          updateProctorStatus('LOOKING_AWAY', inGracePeriod ? "Calibrating camera: Please center your face" : "Face not detected — Please center in webcam");
        }
        return;
      }

      consecutiveNoFace = Math.max(0, consecutiveNoFace - 1);

      // 5. Gaze & Head Orientation Computation
      const faceCenterX = detectedBox.x + detectedBox.w / 2;
      const faceCenterY = detectedBox.y + detectedBox.h / 2;
      const normCenterX = faceCenterX / w;
      const normCenterY = faceCenterY / h;

      const yawRatio = featCenter ? (featCenter.x - detectedBox.x) / detectedBox.w : normCenterX;
      const pitchRatio = featCenter ? (featCenter.y - detectedBox.y) / detectedBox.h : normCenterY;

      // 6. Warmup & Automatic Baseline Calibration (first 10 frames establish neutral head position)
      if (!baselinePose) {
        calibrationFrames++;
        if (!state.calibAccum) {
          state.calibAccum = { sumX: 0, sumY: 0, sumYaw: 0, sumPitch: 0, count: 0 };
        }
        state.calibAccum.sumX += normCenterX;
        state.calibAccum.sumY += normCenterY;
        state.calibAccum.sumYaw += yawRatio;
        state.calibAccum.sumPitch += pitchRatio;
        state.calibAccum.count++;

        if (calibrationFrames < 10) {
          updateProctorStatus('NORMAL', `Calibrating Camera Baseline... Look Straight (${Math.round((calibrationFrames / 10) * 100)}%)`);
          lastPose = 'CENTERED';
          return;
        } else {
          baselinePose = {
            normX: state.calibAccum.sumX / state.calibAccum.count,
            normY: state.calibAccum.sumY / state.calibAccum.count,
            yaw: state.calibAccum.sumYaw / state.calibAccum.count,
            pitch: state.calibAccum.sumPitch / state.calibAccum.count
          };
          logProctorEvent("info", "✓ Baseline established: User looking straight at screen.");
          updateProctorStatus('NORMAL', "Candidate Centered • Identity Verified");
        }
      }

      // 7. Measure relative deviation from neutral baseline
      // Camera mirror notice: Video element is rendered with `transform: scaleX(-1)`
      // When candidate turns towards their RIGHT: In raw webcam feed, candidate shifts left (deltaX < 0, deltaYaw < 0).
      // When candidate turns towards their LEFT: In raw webcam feed, candidate shifts right (deltaX > 0, deltaYaw > 0).
      const deltaX = normCenterX - baselinePose.normX;
      const deltaY = normCenterY - baselinePose.normY;
      const deltaYaw = featCenter ? (yawRatio - baselinePose.yaw) : (deltaX * 1.4);
      const deltaPitch = featCenter ? (pitchRatio - baselinePose.pitch) : (deltaY * 1.4);

      // Directional Classification with responsive thresholds
      let currentPose = 'CENTERED';

      if (deltaPitch > 0.048 || deltaY > 0.050) {
        currentPose = 'LOOK_DOWN';
      } else if (deltaPitch < -0.048 || deltaY < -0.050) {
        currentPose = 'LOOK_UP';
      } else if (deltaYaw < -0.048 || deltaX < -0.048) {
        currentPose = 'TURN_RIGHT';
      } else if (deltaYaw > 0.048 || deltaX > 0.048) {
        currentPose = 'TURN_LEFT';
      } else {
        currentPose = 'CENTERED';
      }

      lastPose = currentPose;

      // 8. Responsive Violation Detection with Strike Accumulators
      if (currentPose === 'TURN_RIGHT') {
        turnRightCounter++;
        turnLeftCounter = Math.max(0, turnLeftCounter - 1);
        lookUpCounter = Math.max(0, lookUpCounter - 1);
        lookDownCounter = Math.max(0, lookDownCounter - 1);

        updateProctorStatus('TURN_RIGHT', "⚠️ Head Turned Right Detected — Face the Screen");
        if (turnRightCounter >= 3) { // Sustained for ~600ms
          handleViolation('TURN_RIGHT', "Looking Right detected! Keep your eyes centered on the exam.");
          turnRightCounter = 1;
        }
      } else if (currentPose === 'TURN_LEFT') {
        turnLeftCounter++;
        turnRightCounter = Math.max(0, turnRightCounter - 1);
        lookUpCounter = Math.max(0, lookUpCounter - 1);
        lookDownCounter = Math.max(0, lookDownCounter - 1);

        updateProctorStatus('TURN_LEFT', "⚠️ Head Turned Left Detected — Face the Screen");
        if (turnLeftCounter >= 3) { // Sustained for ~600ms
          handleViolation('TURN_LEFT', "Looking Left detected! Keep your eyes centered on the exam.");
          turnLeftCounter = 1;
        }
      } else if (currentPose === 'LOOK_UP') {
        lookUpCounter++;
        turnLeftCounter = Math.max(0, turnLeftCounter - 1);
        turnRightCounter = Math.max(0, turnRightCounter - 1);
        lookDownCounter = Math.max(0, lookDownCounter - 1);

        updateProctorStatus('LOOK_UP', "⚠️ Looking Up Detected — Eyes on Exam");
        if (lookUpCounter >= 3) { // Sustained for ~600ms
          handleViolation('LOOK_UP', "Looking Up detected! Please keep your eyes on the exam screen.");
          lookUpCounter = 1;
        }
      } else if (currentPose === 'LOOK_DOWN') {
        lookDownCounter++;
        turnLeftCounter = Math.max(0, turnLeftCounter - 1);
        turnRightCounter = Math.max(0, turnRightCounter - 1);
        lookUpCounter = Math.max(0, lookUpCounter - 1);

        updateProctorStatus('LOOK_DOWN', "⚠️ Looking Down Detected — Suspicious Gaze");
        if (lookDownCounter >= 3) { // Sustained for ~600ms
          handleViolation('LOOK_DOWN', "Suspicious downward gaze detected! Keep your eyes on the exam.");
          lookDownCounter = 1;
        }
      } else {
        // CENTERED / NORMAL
        turnRightCounter = Math.max(0, turnRightCounter - 1);
        turnLeftCounter = Math.max(0, turnLeftCounter - 1);
        lookUpCounter = Math.max(0, lookUpCounter - 1);
        lookDownCounter = Math.max(0, lookDownCounter - 1);
        updateProctorStatus('NORMAL', "Candidate Centered • Identity Verified");
      }
    }

    function handleViolation(type, message) {
      if (state.isDisqualified) return;

      // Throttle alerts by 2.0 seconds to prevent double-strikes while keeping system responsive
      if (state.lastViolationTime && (Date.now() - state.lastViolationTime < 2000)) {
        return;
      }
      state.lastViolationTime = Date.now();
      const maxStrikes = state.proctorMaxStrikes || 4;
      state.proctorStrikes = (state.proctorStrikes || 0) + 1;
      state.proctorIntegrityPct = Math.max(0, 100 - state.proctorStrikes * 25);

      updateProctorStatus(type, message);
      logProctorEvent("warning", `⚠️ Strike #${state.proctorStrikes}: ${message}`);
      playWarningChirp();

      // Visual pulse on proctor panel
      const panel = document.getElementById('proctorPanel');
      if (panel) {
        panel.classList.add('violation-pulse');
        setTimeout(() => { if (panel) panel.classList.remove('violation-pulse'); }, 3000);
      }

      // Display alert banner
      const alertBox = document.getElementById('proctorAlertBox');
      const alertMsg = document.getElementById('proctorAlertMsg');
      if (alertBox && alertMsg) {
        alertBox.style.display = 'flex';
        alertMsg.textContent = `Strike #${state.proctorStrikes}/${maxStrikes}: ${message}`;
        setTimeout(() => { if (alertBox) alertBox.style.display = 'none'; }, 4000);
      }

      showToastNotification(`🚨 Anti-Cheating Alert: ${message} (Strike ${state.proctorStrikes}/${maxStrikes})`);

      // Update counters
      const strikesEl = document.getElementById('proctorStrikesDisplay');
      if (strikesEl) {
        strikesEl.textContent = `${state.proctorStrikes} / ${maxStrikes}`;
        strikesEl.style.color = state.proctorStrikes >= 3 ? '#ef4444' : state.proctorStrikes >= 1 ? '#f59e0b' : '#10b981';
      }

      const badgeEl = document.getElementById('proctorIntegrityBadge');
      if (badgeEl) {
        badgeEl.textContent = `${state.proctorIntegrityPct}% INTEGRITY`;
        badgeEl.style.background = state.proctorStrikes >= 3 ? 'rgba(239, 68, 68, 0.2)' : 'rgba(16, 185, 129, 0.2)';
        badgeEl.style.color = state.proctorStrikes >= 3 ? '#ef4444' : '#10b981';
      }

      // CRITICAL: When full cheating limit is reached, immediately fail and disqualify!
      if (state.proctorStrikes >= maxStrikes) {
        handleCheatingDisqualification();
      }
    }

    function handleCheatingDisqualification() {

      if (state.timerInterval) {

      logProctorEvent("danger", "🚨 CRITICAL: Maximum cheating limits exceeded. Exam terminated with grade FAIL.");

      const timeStr = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        proctorLogs: [...(state.proctorLogs || [])]

      // 5. Open Disqualification Modal
      openDisqualificationModal(curExam.title, curExam.id, attemptNum);

    function logProctorEvent(level, message) {

    function playWarningChirp() {
      try {
        const ctx = getProctorAudioCtx();
        if (ctx) {
          if (ctx.state === 'suspended') {
            ctx.resume().catch(() => { });
          }
          const now = ctx.currentTime;

          // Loud dual-frequency alert beep (tone 1: 920Hz -> 600Hz, tone 2: 1050Hz -> 500Hz)
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sawtooth';
          osc1.frequency.setValueAtTime(920, now);
          osc1.frequency.exponentialRampToValueAtTime(600, now + 0.15);
          gain1.gain.setValueAtTime(0.50, now);
          gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.16);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sawtooth';
          osc2.frequency.setValueAtTime(1050, now + 0.17);
          osc2.frequency.exponentialRampToValueAtTime(500, now + 0.35);
          gain2.gain.setValueAtTime(0.55, now + 0.17);
          gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.17);
          osc2.stop(now + 0.36);
        }
      } catch (e) {
        console.warn("Could not play warning sound:", e);
      }
    }

    function playCriticalFailureSiren() {
      try {
        const ctx = getProctorAudioCtx();
        if (ctx) {
          if (ctx.state === 'suspended') {
            ctx.resume().catch(() => { });
          }
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(900, now);
          osc.frequency.linearRampToValueAtTime(450, now + 0.25);
          osc.frequency.linearRampToValueAtTime(900, now + 0.50);
          osc.frequency.linearRampToValueAtTime(350, now + 0.90);
          gain.gain.setValueAtTime(0.60, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.90);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.91);
        }
      } catch (e) { }
    }

    function attachProctorSecurityListeners() {
      if (window._proctorListenersAttached) return;
      window._proctorListenersAttached = true;

      // Tab Switch / Screen Loss of Focus Detection
      window.addEventListener('blur', () => {
        if (state.currentView === 'exam-room') {
          if (Date.now() - (state.examStartTime || 0) < 15000) return;

          const focusEl = document.getElementById('proctorFocusDisplay');
          if (focusEl) {
            focusEl.textContent = "Lost Focus ⚠️";
            focusEl.style.color = "#f59e0b";
          }
          logProctorEvent("warning", "Screen focus lost — please remain focused on the exam interface.");
        }
      });

      window.addEventListener('focus', () => {
        if (state.currentView === 'exam-room') {
          const focusEl = document.getElementById('proctorFocusDisplay');
          if (focusEl) {
            focusEl.textContent = "Locked 🔒";
            focusEl.style.color = "#60a5fa";
          }
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (state.currentView === 'exam-room' && document.hidden) {
          if (Date.now() - (state.examStartTime || 0) >= 15000) {
            handleViolation('TAB_SWITCH', "Screen hidden / tab switched during exam!");
          }
        }
      });

      // Prohibited key shortcuts (Inspect, Copy, Paste, PrintScreen)
      window.addEventListener('keydown', (e) => {
        if (state.currentView === 'exam-room') {
          if (e.key === 'F12' || (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'u' || e.key === 'a'))) {
            e.preventDefault();
            handleViolation('KEY_VIOLATION', `Prohibited shortcut [${e.key.toUpperCase()}] blocked!`);
          }
        }
      });
    }

    function selectExamOption(optIndex) {
      const curExam = allExams[state.selectedExamId] || (Object.values(allExams)[0] || { id: 'NONE', title: 'No Examination', totalQuestions: 0, durationMinutes: 15, passingPercentage: 60, questions: [] });
      if (!state.answers[curExam.id]) state.answers[curExam.id] = {};
      state.answers[curExam.id][state.currentQIndex] = optIndex;
      renderExamRoom(document.getElementById('appViewport'));
    }

    function clearCurrentAnswer() {
      const curExam = allExams[state.selectedExamId] || (Object.values(allExams)[0] || { id: 'NONE', title: 'No Examination', totalQuestions: 0, durationMinutes: 15, passingPercentage: 60, questions: [] });
      if (state.answers[curExam.id]) {
        delete state.answers[curExam.id][state.currentQIndex];
      }
      renderExamRoom(document.getElementById('appViewport'));
    }

    function nextQuestion() {
      const curExam = allExams[state.selectedExamId] || (Object.values(allExams)[0] || { id: 'NONE', title: 'No Examination', totalQuestions: 0, durationMinutes: 15, passingPercentage: 60, questions: [] });
      if (state.currentQIndex < curExam.questions.length - 1) {
        state.currentQIndex++;
        renderExamRoom(document.getElementById('appViewport'));
      }
    }

    function prevQuestion() {
      if (state.currentQIndex > 0) {
        state.currentQIndex--;
        renderExamRoom(document.getElementById('appViewport'));
      }
    }

    function gotoQuestion(index) {
      state.currentQIndex = index;
      renderExamRoom(document.getElementById('appViewport'));
    }

    function submitExamPrompt() {
      // If student was disqualified due to cheating limit, reject submission & show disqualification
      if (state.isDisqualified || ((state.proctorStrikes || 0) >= (state.proctorMaxStrikes || 4))) {
        handleCheatingDisqualification();
        return;
      }

      // Turn off webcam stream cleanly upon completion
      stopProctoringSystem();

      const curExam = allExams[state.selectedExamId] || (Object.values(allExams)[0] || { id: 'NONE', title: 'No Examination', totalQuestions: 0, durationMinutes: 15, passingPercentage: 60, questions: [] });
      let score = 0;
      const examAns = state.answers[curExam.id] || {};
      curExam.questions.forEach((q, idx) => {
        if (examAns[idx] === q.correct) score++;
      });
      const total = curExam.questions.length; // 20
      const pct = Math.round((score / total) * 100);
      const attemptNum = (state.examAttempts && state.examAttempts[curExam.id]) || 1;

      // Record in verified attempt history with proctor metrics
      const now = new Date();
      const timeStr = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      state.history = state.history || [];
      state.history.unshift({
        id: "RES-" + Math.floor(1000 + Math.random() * 9000),
        examId: curExam.id,
        examTitle: curExam.title,
        date: timeStr,
        score: score,
        total: total,
        pct: pct,
        passed: pct >= 60,
        timeTaken: formatHMS(curExam.durationMinutes * 60 - (state.remainingSeconds[curExam.id] || 0)),
        attempt: attemptNum,
        proctorStrikes: state.proctorStrikes || 0,
        integrityScore: state.proctorIntegrityPct || 100,
        proctorLogs: [...(state.proctorLogs || [])]
      });

      // Display scorecard modal with full AI Proctoring Audit Report
      openScorecardModal(curExam.title, curExam.id, score, total, pct, attemptNum);

      // Rotate question bank for the next attempt upon submission
      rotateExamQuestions(curExam.id);

      showToastNotification(`🔄 Question Bank Rotated: New questions generated for ${curExam.title} (Attempt #${attemptNum + 1})!`);
    }

            <div style="background: var(--bg-card-subtle); padding: 14px; border-radius: var(--radius-sm); border-left: 3px solid #10b981; margin-bottom: 20px;">
              <div style="font-size: var(--fs-base); font-weight: 700; color: #fff;">${state.isAuthenticated && state.user ? `Active Session: ${state.user ? state.user.name : 'Administrator'}` : 'Session Inactive (Sign In Required)'}</div>
              <div style="font-size: var(--fs-xs); color: var(--text-muted); margin-top: 3px;">${state.isAuthenticated && state.user ? `Logged in as ${state.user.roleLabel} (${state.user ? state.user.id : 'ADMIN'}). AI Proctoring & ${Object.keys(allExams).length} examinations active.` : 'Sign in to access your student candidate dashboard or administrator console.'}</div>
            </div>
            <button class="btn-resume-glow" style="width: 100%; justify-content: center;" onclick="closeNotificationsModal()">
              Dismiss
            </button>
          </div>
        </div>
      `;
      modal.style.display = 'block';
    }

    function closeNotificationsModal() {
      document.getElementById('modalRoot').style.display = 'none';
    }

    // Initialize application: Restore active user session if remembered, or launch on Sign In
    let sessionRestored = false;
    try {
      const activeUserStr = localStorage.getItem('online_exam_active_user');
      if (activeUserStr) {
        const activeUser = JSON.parse(activeUserStr);
        if (activeUser && activeUser.role) {
          loginUser(activeUser);
          sessionRestored = true;
        }
      }
    } catch (e) { }

    if (!sessionRestored) {
      state.isAuthenticated = false;
      state.user = null;
      updateNavbarUserInfo();
      if (typeof renderSidebarNavigation === 'function') {
        renderSidebarNavigation();
      }
      showView('auth');
    }

    syncWithSQLiteDatabase();
  </script>
</body>

</html>
