<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Examination Portal - Secure Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-main: #070e1e;
      --bg-sidebar: #060b18;
      --bg-card: #0d172e;
      --bg-card-subtle: #111e3b;
      --bg-card-hover: #16264a;
      --border-color: #172649;
      --border-highlight: #223766;

      --accent-blue: #2563eb;
      --accent-blue-hover: #1d4ed8;
      --accent-blue-glow: rgba(37, 99, 235, 0.35);
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-purple: #8b5cf6;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;

      /* Standardized Semantic Text Colors (8 core colors, strictly under 12 limit) */
      --text-white: #ffffff;
      --text-primary: #e2e8f0;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --text-blue: #60a5fa;
      --text-purple: #c4b5fd;
      --text-green: #34d399;
      --text-amber: #fbbf24;
      --text-red: #ef4444;

      /* Standardized Type Scale (8 discrete steps, strictly under 10 limit, all >= 12px) */
      --fs-xs: 12px;
      /* minimum legible size for badges/captions */
      --fs-sm: 13px;
      /* secondary text, stat footers, table details */
      --fs-base: 14px;
      /* default body text, buttons, form inputs */
      --fs-md: 16px;
      /* card headers, emphasized text */
      --fs-lg: 18px;
      /* section titles */
      --fs-xl: 20px;
      /* subheadings */
      --fs-2xl: 24px;
      /* page headings */
      --fs-3xl: 32px;
      /* display numbers, metric stats */

      /* Standardized Border Radii (4 discrete tokens + full, strictly under 6 limit) */
      --radius-xs: 4px;
      /* subtle badges, code chips */
      --radius-sm: 8px;
      /* buttons, inputs, table cards */
      --radius-md: 12px;
      /* cards, modals, popups */
      --radius-lg: 16px;
      /* hero frames, dashboard cards */
      --radius-full: 9999px;
      /* pill badges, round avatars (50%) */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html {
      height: 100%;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      height: 100vh;
      min-height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 225px;
      min-width: 225px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 12px 14px 12px;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      flex-shrink: 0;
    }

    .sidebar::-webkit-scrollbar {
      width: 4px;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-xs);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 8px 16px 8px;
      text-decoration: none;
      cursor: pointer;
    }

    .brand-icon {
      font-size: var(--fs-xl);
      filter: drop-shadow(0 2px 8px rgba(37, 99, 235, 0.4));
    }

    .brand-title {
      color: var(--text-white);
      font-size: var(--fs-base);
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
    }

    .nav-item a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: var(--radius-sm);
      font-size: var(--fs-base);
      font-weight: 600;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .nav-item a:hover {
      background: var(--bg-card-subtle);
      color: var(--text-white);
    }

    .nav-item.active a {
      background: rgba(37, 99, 235, 0.16);
      color: #60a5fa;
      border-left: 3px solid var(--accent-blue);
    }

    .nav-icon {
      font-size: var(--fs-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
    }

    .sidebar-footer-card {
      background: linear-gradient(180deg, rgba(17, 30, 59, 0.6) 0%, rgba(13, 23, 46, 0.8) 100%);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      text-align: center;
      margin-top: auto;
    }

    .quote-illu {
      font-size: var(--fs-lg);
      margin-bottom: 4px;
    }

    .quote-text {
      color: var(--text-muted);
      font-size: var(--fs-xs);
      line-height: 1.35;
      font-style: italic;
    }

    /* MAIN VIEWPORT */
    .main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      background: radial-gradient(circle at 85% 10%, rgba(37, 99, 235, 0.08), transparent 40%),
        radial-gradient(circle at 15% 90%, rgba(16, 185, 129, 0.04), transparent 40%),
        var(--bg-main);
    }

    .main-viewport::-webkit-scrollbar {
      width: 6px;
    }

    .main-viewport::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: var(--radius-xs);
    }

    .main-viewport::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    .top-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px 8px 24px;
      flex-shrink: 0;
    }

    .welcome-heading {
      font-size: var(--fs-xl);
      font-weight: 800;
      color: var(--text-white);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .welcome-sub {
      color: var(--text-muted);
      font-size: var(--fs-sm);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .datetime-chip {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 5px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: var(--fs-sm);
    }

    .date-part,
    .time-part {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
    }

    .date-part strong,
    .time-part strong {
      color: var(--text-white);
      font-weight: 600;
    }

    .icon-btn-bell {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      font-size: var(--fs-md);
      transition: all 0.2s;
    }

    .icon-btn-bell:hover {
      background: var(--bg-card-hover);
      color: var(--text-white);
    }

    .bell-dot {
      width: 7px;
      height: 7px;
      background: var(--accent-red);
      border-radius: 50%;
      position: absolute;
      top: 8px;
      right: 8px;
      box-shadow: 0 0 5px var(--accent-red);
    }

    .user-profile-widget {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 5px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .user-profile-widget:hover {
      border-color: var(--border-highlight);
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: var(--fs-sm);
      color: var(--text-white);
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.4);
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .user-name {
      font-size: var(--fs-sm);
      font-weight: 700;
      color: var(--text-white);
    }

    .user-id {
      font-size: var(--fs-xs);
      color: var(--text-dim);
    }

    /* CONTENT VIEWPORT */
    .content-viewport {
      padding: 8px 24px 18px 24px;
      flex: 1;
    }

    /* DASHBOARD GRID */
    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 290px;
      gap: 14px;
      align-items: start;
    }

    .left-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    /* TOP 3 STAT CARDS */
    .stats-row-three {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-highlight);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    }

    .stat-icon-wrapper {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--fs-lg);
    }

    .stat-icon-wrapper.blue {
      background: rgba(37, 99, 235, 0.15);
      color: #60a5fa;
    }

    .stat-icon-wrapper.green {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }

    .stat-icon-wrapper.purple {
      background: rgba(139, 92, 246, 0.15);
      color: #c084fc;
    }

    .stat-data {
      display: flex;
      flex-direction: column;
    }

    .stat-title {
      font-size: var(--fs-xs);
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .stat-number {
      font-size: var(--fs-xl);
      font-weight: 800;
      color: var(--text-white);
      line-height: 1.15;
      margin: 1px 0;
    }

    .stat-foot {
      font-size: var(--fs-xs);
      color: var(--text-dim);
      font-weight: 600;
    }

    #sidebarRoleBadge,
    #sidebarRoleBadge>span {
      font-size: var(--fs-sm) !important;
      /* Standardized 13px >= 12px threshold */
    }

    /* HERO CARD FOR ACTIVE EXAM */
    .currently-active-card {
      background: linear-gradient(135deg, #0e1b38 0%, #0c1630 100%);
      border: 1px solid #1e3360;
      border-radius: var(--radius-lg);
      padding: 28px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
    }

    .currently-active-card::after {
      content: "💻";
      position: absolute;
      right: 28px;
      top: 14px;
      font-size: var(--fs-3xl);
      opacity: 0.10;
      pointer-events: none;
    }

    .active-exam-left {
      max-width: 60%;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: var(--fs-xs);
      font-weight: 700;
      margin-bottom: 12px;
    }

    .badge-pill.green {
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-pill.blue {
      background: rgba(37, 99, 235, 0.18);
      color: #60a5fa;
      border: 1px solid rgba(37, 99, 235, 0.3);
    }

    .badge-pill.purple {
      background: rgba(139, 92, 246, 0.18);
      color: #c084fc;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .active-exam-title {
      font-size: var(--fs-2xl);
      font-weight: 800;
      color: var(--text-white);
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .active-exam-meta {
      color: var(--text-muted);
      font-size: var(--fs-base);
      margin-bottom: 18px;
      font-weight: 500;
    }

    .progress-bar-container {
      width: 100%;
    }

    .progress-track {
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill-active {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, #10b981, #34d399);
      border-radius: var(--radius-full);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: var(--fs-sm);
      color: var(--text-muted);
      font-weight: 600;
    }

    .active-exam-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 16px;
      z-index: 1;
    }

    .timer-badge-box {
      background: rgba(8, 16, 34, 0.65);
      border: 1px solid rgba(37, 99, 235, 0.25);
      border-radius: var(--radius-md);
      padding: 12px 20px;
      text-align: right;
    }

    .timer-badge-box .tb-label {
      font-size: var(--fs-xs);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: flex-end;
      margin-bottom: 4px;
    }

    .timer-badge-box .tb-clock {
      font-size: var(--fs-2xl);
      font-weight: 800;
      color: var(--text-white);
      letter-spacing: 0.05em;
    }

    /* UNIFIED 5-TIER BUTTON DESIGN SYSTEM */
    .btn-primary,
    .btn-secondary,
    .btn-danger,
    .btn-tab,
    .btn-icon,
    .btn-resume-glow,
    .btn-action-outline {
      font-family: inherit;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      line-height: 1.2;
      border: 1px solid transparent;
    }

    /* 1. Primary Solid Action Button */
    .btn-primary,
    .btn-resume-glow {
      background: var(--accent-blue);
      color: var(--text-white);
      border-color: transparent;
      padding: 8px 16px;
      font-size: var(--fs-sm);
      font-weight: 700;
      box-shadow: 0 4px 14px var(--accent-blue-glow);
    }

    .btn-primary:hover,
    .btn-resume-glow:hover {
      background: var(--accent-blue-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.55);
    }

    /* 2. Secondary Outline / Subtle Surface Button */
    .btn-secondary,
    .btn-action-outline {
      background: rgba(30, 41, 59, 0.4);
      border-color: #233e72;
      color: var(--text-blue);
      padding: 6px 14px;
      font-size: var(--fs-sm);
      font-weight: 600;
    }

    .btn-secondary:hover,
    .btn-action-outline:hover {
      background: rgba(37, 99, 235, 0.15);
      border-color: var(--accent-blue);
      color: var(--text-white);
    }

    /* 3. Danger Outline Action Button */
    .btn-danger {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 6px 12px;
      font-size: var(--fs-sm);
      font-weight: 600;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: #ef4444;
      color: #fff;
    }

    /* 4. Tab Segmented Button */
    .btn-tab {
      background: transparent;
      border-color: transparent;
      color: var(--text-muted);
      padding: 8px 14px;
      font-size: var(--fs-sm);
      font-weight: 600;
    }

    .btn-tab.active,
    .btn-tab:hover {
      background: rgba(37, 99, 235, 0.16);
      color: var(--text-white);
      border-color: var(--accent-blue);
    }

    /* 5. Circular Icon Button */
    .btn-icon,
    .icon-btn-bell {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      padding: 0;
      font-size: var(--fs-md);
    }

    .btn-icon:hover,
    .icon-btn-bell:hover {
      background: var(--bg-card-hover);
      color: var(--text-white);
    }

    /* RIGHT COLUMN */
    .right-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .card-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    .panel-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .panel-top-row h2,
    .panel-top-row h3 {
      margin: 0;
      font-size: var(--fs-md);
      font-weight: 700;
      color: var(--text-white);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* PERFORMANCE DONUT GAUGE */
    .gauge-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 4px 0 10px;
    }

    .donut-chart-container {
      position: relative;
      width: 90px;
      height: 90px;
    }

    .donut-chart-container svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .donut-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.06);
      stroke-width: 10;
    }

    .donut-val {
      fill: none;
      stroke: var(--accent-blue);
      stroke-width: 10;
      stroke-dasharray: 377;
      stroke-dashoffset: 38;
      stroke-linecap: round;
      filter: drop-shadow(0 0 5px rgba(37, 99, 235, 0.6));
    }

    .gauge-center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .gc-val {
      font-size: var(--fs-xl);
      font-weight: 800;
      color: var(--text-white);
      line-height: 1;
    }

    .gc-lbl {
      font-size: var(--fs-xs);
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 2px;
    }

    .subject-progress-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .sp-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sp-header {
      display: flex;
      justify-content: space-between;
      font-size: var(--fs-xs);
      font-weight: 600;
    }

    .sp-title {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--fs-xs);
    }

    .sp-score {
      color: var(--text-white);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .dot.green {
      background: var(--accent-green);
      box-shadow: 0 0 5px var(--accent-green);
    }

    .dot.blue {
      background: var(--accent-blue);
      box-shadow: 0 0 5px var(--accent-blue);
    }

    .dot.purple {
      background: var(--accent-purple);
      box-shadow: 0 0 5px var(--accent-purple);
    }

    .sp-track {
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .sp-fill {
      height: 100%;
      border-radius: var(--radius-full);
    }

    .sp-fill.green {
      width: 90%;
      background: var(--accent-green);
    }

    .sp-fill.blue {
      width: 85%;
      background: var(--accent-blue);
    }

    .sp-fill.purple {
      width: 100%;
      background: var(--accent-purple);
    }

    /* EXAM ROOM STYLES */
    .exam-room-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 28px;
      max-width: 1220px;
      margin: 0 auto;
    }

    .exam-room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 28px;
    }

    .exam-body-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 28px;
    }

    .q-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(37, 99, 235, 0.15);
      color: #60a5fa;
      border-radius: var(--radius-sm);
      font-size: var(--fs-sm);
      font-weight: 700;
      margin-bottom: 14px;
    }

    .q-text {
      font-size: var(--fs-lg);
      font-weight: 700;
      color: var(--text-white);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      color: var(--text-primary);
      text-align: left;
      font-size: var(--fs-base);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s;
    }

    .option-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-highlight);
      color: var(--text-white);
    }

    .option-btn.selected {
      background: rgba(37, 99, 235, 0.20);
      border-color: var(--accent-blue);
      color: var(--text-white);
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.3);
    }

    .opt-letter {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: var(--fs-sm);
    }

    .option-btn.selected .opt-letter {
      background: var(--accent-blue);
      color: #fff;
    }

    /* AI WEBCAM & PROCTORING SYSTEM */
    .exam-sidebar-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .proctor-panel {
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      transition: all 0.3s ease;
    }

    .proctor-panel.violation-pulse {
      animation: proctorRedPulse 0.9s infinite alternate;
      border-color: #ef4444 !important;
    }

    @keyframes proctorRedPulse {
      0% {
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        border-color: #ef4444;
      }

      100% {
        box-shadow: 0 0 25px rgba(239, 68, 68, 0.9);
        border-color: #f87171;
      }
    }

    @keyframes shakeModal {

      0%,
      100% {
        transform: translateY(0);
      }

      20%,
      60% {
        transform: translateY(-8px) scale(1.02);
      }

      40%,
      80% {
        transform: translateY(8px) scale(1.01);
      }
    }

    .proctor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .proctor-badge-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: var(--fs-xs);
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #ef4444;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 3px 8px;
      border-radius: var(--radius-full);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulseDot 1.2s infinite;
    }

    @keyframes pulseDot {
      0% {
        transform: scale(0.9);
        opacity: 1;
      }

      50% {
        transform: scale(1.4);
        opacity: 0.4;
      }

      100% {
        transform: scale(0.9);
        opacity: 1;
      }
    }

    .proctor-integrity-pill {
      font-size: var(--fs-xs);
      font-weight: 800;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #10b981;
    }

    .proctor-video-container {
      position: relative;
      width: 100%;
      height: 195px;
      min-height: 195px;
      background: #020617;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid rgba(37, 99, 235, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-sizing: border-box;
    }

    .proctor-video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .proctor-video-container canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Laser scanning HUD beam */
    .proctor-scan-beam {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.95), transparent);
      box-shadow: 0 0 10px #38bdf8;
      animation: proctorScan 3s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes proctorScan {
      0% {
        top: 0%;
        opacity: 0.2;
      }

      50% {
        opacity: 0.95;
      }

      100% {
        top: 98%;
        opacity: 0.2;
      }
    }

    .proctor-corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: #38bdf8;
      pointer-events: none;
    }

    .corner-tl {
      top: 8px;
      left: 8px;
      border-top: 2px solid #38bdf8;
      border-left: 2px solid #38bdf8;
    }

    .corner-tr {
      top: 8px;
      right: 8px;
      border-top: 2px solid #38bdf8;
      border-right: 2px solid #38bdf8;
    }

    .corner-bl {
      bottom: 8px;
      left: 8px;
      border-bottom: 2px solid #38bdf8;
      border-left: 2px solid #38bdf8;
    }

    .corner-br {
      bottom: 8px;
      right: 8px;
      border-bottom: 2px solid #38bdf8;
      border-right: 2px solid #38bdf8;
    }

    .proctor-status-strip {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 6px 10px;
      background: rgba(3, 7, 18, 0.88);
      backdrop-filter: blur(4px);
      font-size: var(--fs-xs);
      font-weight: 700;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 2;
    }

    .proctor-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .pstat-item {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--radius-sm);
      padding: 8px;
      text-align: center;
    }

    .pstat-label {
      font-size: var(--fs-xs);
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .pstat-val {
      font-size: var(--fs-base);
      font-weight: 800;
      margin-top: 2px;
    }

    .proctor-alert-box {
      margin-top: 8px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: alertSlideIn 0.3s ease;
    }

    @keyframes alertSlideIn {
      from {
        transform: translateY(-4px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .p-alert-icon {
      font-size: var(--fs-md);
    }

    .p-alert-msg {
      font-size: var(--fs-xs);
      color: #fca5a5;
      font-weight: 700;
      line-height: 1.3;
    }

    .proctor-log-container {
      margin-top: 10px;
      background: rgba(0, 0, 0, 0.28);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .proctor-log-title {
      font-size: var(--fs-xs);
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .proctor-log-list {
      max-height: 60px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: var(--fs-xs);
    }

    .proctor-log-list::-webkit-scrollbar {
      width: 4px;
    }

    .proctor-log-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-xs);
    }

    .plog-item {
      color: #94a3b8;
      line-height: 1.3;
    }

    .plog-item.log-warning {
      color: #f59e0b;
      font-weight: 600;
    }

    .plog-item.log-danger {
      color: #ef4444;
      font-weight: 700;
    }

    .plog-item.log-success {
      color: #10b981;
    }

    .plog-time {
      color: var(--text-dim);
      margin-right: 4px;
    }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(4, 8, 18, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-highlight);
      border-radius: var(--radius-lg);
      width: 90%;
      max-width: 520px;
      padding: 32px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    /* =========================================================================
       ADMINISTRATOR EXAMINATION MODULES TABLE STYLES
       Guarantees recommended column proportions, header-data alignment & responsive scroll
       ========================================================================= */
    .table-responsive-admin {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: var(--radius-sm);
      margin-top: 8px;
    }

    .admin-exam-table {
      width: 100%;
      min-width: 960px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    .admin-exam-table th {
      background: rgba(15, 23, 42, 0.85);
      color: #94a3b8;
      font-size: var(--fs-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 14px 12px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .admin-exam-table td {

      border-bottom: 1px solid rgba(255, 255, 255, 0.06);

      color: #e2e8f0;
      vertical-align: middle;
      box-sizing: border-box;
    }

    .admin-exam-table tr:hover td {
      background: rgba(30, 58, 138, 0.14);
    }

    .admin-exam-col-title {
      width: 25%;
      text-align: left;
    }

    .admin-exam-col-category {
      width: 13%;
      text-align: left;
    }

    .admin-exam-col-questions {
      width: 12%;
      text-align: center;
    }

    .admin-exam-col-duration {
      width: 8%;
      text-align: center;
    }

    .admin-exam-col-pass {
      width: 7%;
      text-align: center;
    }

    .admin-exam-col-marks {
      width: 9%;
      text-align: center;
    }

    .admin-exam-col-actions {
      width: 26%;
      text-align: right;
    }

    .admin-action-btn-group {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .admin-exam-btn {
      height: 32px;
      padding: 0 12px;
      font-size: var(--fs-xs);
      font-weight: 700;
      white-space: nowrap;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      box-sizing: border-box;
      transition: all 0.2s;
    }

    .admin-exam-btn:hover {
      transform: translateY(-1px);
    }

    /* =========================================================================
       ADMINISTRATOR STUDENT CANDIDATE REGISTRY TABLE STYLES
       Guarantees recommended column proportions (14%, 20%, 20%, 13%, 18%, 15%),
       header-data alignment, vertical stacking of name/email & responsive scroll
       ========================================================================= */
    .admin-student-table {
      width: 100%;
      min-width: 900px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    .admin-student-table th {
      background: rgba(15, 23, 42, 0.85);
      color: #94a3b8;
      font-size: var(--fs-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 14px 12px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .admin-student-table td {
      padding: 16px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: var(--fs-sm);
      color: #e2e8f0;
      vertical-align: middle;
      box-sizing: border-box;
    }

    .admin-student-table tr:hover td {
      background: rgba(30, 58, 138, 0.14);
    }

    .admin-student-col-roll {
      width: 14%;
      text-align: center;
    }

    .admin-student-col-name {
      width: 20%;
      text-align: left;
    }

    .admin-student-col-program {
      width: 20%;
      text-align: left;
    }

    .admin-student-col-exams {
      width: 13%;
      text-align: center;
    }

    .admin-student-col-avg {
      width: 18%;
      text-align: center;
    }

    .admin-student-col-status {
      width: 15%;
      text-align: center;
    }

    /* TABLES & CONTROLS */
    .custom-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }

    .custom-table th {
      text-align: left;
      padding: 7px 10px;
      color: var(--text-dim);
      font-size: var(--fs-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border-color);
    }

    .custom-table td {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(23, 38, 73, 0.6);
      font-size: var(--fs-sm);
      color: var(--text-primary);
      vertical-align: middle;
    }

    .exam-id-tag {
      font-weight: 700;
      color: #93c5fa;
      font-family: monospace;
      font-size: var(--fs-base);
    }

    .subject-bold {
      font-weight: 700;
      color: var(--text-white);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
      text-align: left;
    }

    .form-label {
      font-size: var(--fs-sm);
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-input {
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: var(--text-white);
      font-size: var(--fs-base);
      outline: none;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
    }

    .toggle-info h4 {
      font-size: var(--fs-base);
      color: var(--text-white);
      font-weight: 700;
    }

    .toggle-info p {
      font-size: var(--fs-xs);
      color: var(--text-muted);
      margin-top: 2px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #1e293b;
      transition: .3s;
      border-radius: var(--radius-full);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: var(--accent-blue);
    }

    input:checked+.slider:before {
      transform: translateX(20px);
    }

    /* =========================================================================
       USER AUTHENTICATION THEME & STYLES
       ========================================================================= */
    .auth-container {
      max-width: 940px;
      margin: 18px auto;
      background: var(--bg-card);
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.15fr 1.35fr;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45), 0 0 35px rgba(56, 189, 248, 0.08);
      align-items: stretch;
    }

    .auth-hero-side {
      background: linear-gradient(145deg, #0d1a3a 0%, #081126 100%);
      padding: 30px 32px;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      position: relative;
    }

    .auth-hero-side::before {
      content: "";
      position: absolute;
      top: -40px;
      left: -40px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.25) 0%, transparent 70%);
      pointer-events: none;
    }

    .auth-form-side {
      padding: 30px 32px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      background: var(--bg-card);
    }

    .auth-tabs-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .auth-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: var(--fs-base);
      font-weight: 700;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
    }

    .auth-tab-btn.active {
      color: #fff;
      background: rgba(37, 99, 235, 0.22);
      border-bottom: 2px solid var(--accent-blue);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }

    .role-pills-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .role-pill-btn {
      flex: 1;
      padding: 9px 10px;
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: var(--fs-sm);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .role-pill-btn:hover {
      border-color: #2b4880;
      color: #fff;
      background: var(--bg-card-hover);
    }

    .role-pill-btn.active[data-role="student"],
    .role-pill-btn.active:nth-child(1) {
      border-color: #3b82f6;
      color: #fff;
      background: rgba(37, 99, 235, 0.25);
      box-shadow: 0 0 16px rgba(37, 99, 235, 0.35);
    }

    .role-pill-btn.active[data-role="faculty"],
    .role-pill-btn.active:nth-child(2) {
      border-color: #10b981;
      color: #fff;
      background: rgba(16, 185, 129, 0.22);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.35);
    }

    .role-pill-btn.active[data-role="admin"],
    .role-pill-btn.active:nth-child(3) {
      border-color: #8b5cf6;
      color: #fff;
      background: rgba(139, 92, 246, 0.25);
      box-shadow: 0 0 16px rgba(139, 92, 246, 0.35);
    }

    .input-field-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-lead {
      position: absolute;
      left: 14px;
      color: #60a5fa;
      font-size: var(--fs-md);
      pointer-events: none;
    }

    .auth-input {
      width: 100%;
      background: #091226;
      border: 1px solid #1a2d54;
      border-radius: var(--radius-sm);
      padding: 12px 14px 12px 42px;
      color: #ffffff;
      font-size: var(--fs-base);
      outline: none;
      transition: all 0.2s;
    }

    .auth-input::placeholder {
      color: #71829e;
    }

    .auth-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35);
      background: #0d1b38;
    }

    .input-toggle-pwd {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: var(--fs-md);
      padding: 4px;
    }

    .input-toggle-pwd:hover {
      color: var(--text-white);
    }



    /* TOAST NOTIFICATION */
    .auth-toast {
      position: fixed;
      top: 24px;
      right: 24px;
      background: #0e2044;
      border: 1px solid #2563eb;
      border-left: 4px solid #10b981;
      padding: 14px 22px;
      border-radius: var(--radius-md);
      color: #fff;

    const masterQuestionPools = {

    // =========================================================================
    // STUDENT CANDIDATE REPOSITORY & USER STORE (Clean State - No Default Accounts)
    // =========================================================================
    const registeredCandidates = {};
    const registeredAdmins = {};

    // Storage helpers for persistent examinations and question banks

    // =========================================================================
    // SQLITE 3 DATABASE CLIENT SYNCHRONIZATION
    // =========================================================================
    async function syncWithSQLiteDatabase() {
      try {
        const statusRes = await fetch('/api/status');
        if (!statusRes.ok) return;
        const statusData = await statusRes.json();
        console.log("Connected to SQLite Database:", statusData.database_file);

        // 1. Fetch Students from SQLite table 'users'
        try {
          const studentsRes = await fetch('/api/students');
          if (studentsRes.ok) {
            const dbStudents = await studentsRes.json();
            if (Array.isArray(dbStudents)) {
              for (const k in registeredCandidates) delete registeredCandidates[k];
              dbStudents.forEach(s => {
                const rollIdStr = s.rollId ? String(s.rollId) : (s.username ? String(s.username) : String(s.id || ''));
                const studentObj = {
                  username: (s.username || rollIdStr).toLowerCase(),
                  password: s.password || '',
                  id: rollIdStr,
                  name: s.name || s.full_name || 'Student Candidate',
                  role: 'student',
                  roleLabel: 'Registered Candidate',
                  email: s.email || '',
                  program: s.program || 'Master of Computer Applications (MCA)',
                  avatar: ((s.name || s.full_name || 'ST').split(' ').map(n => n[0]).join('')).substring(0, 2).toUpperCase()
                };
                if (studentObj.username) registeredCandidates[studentObj.username.toLowerCase()] = studentObj;
                if (studentObj.id) {
                  registeredCandidates[studentObj.id.toLowerCase()] = studentObj;
                  registeredCandidates[studentObj.id.toUpperCase()] = studentObj;
                }
                if (studentObj.email) registeredCandidates[studentObj.email.toLowerCase()] = studentObj;
                if (s.id) registeredCandidates[String(s.id).toLowerCase()] = studentObj;
              });
              try {
                localStorage.setItem('online_exam_registered_students', JSON.stringify(registeredCandidates));
              } catch (e) { }
            }
          }
        } catch (e) { }

        // 2. Fetch Administrators from SQLite table 'users'
        try {
          const adminsRes = await fetch('/api/admins');
          if (adminsRes.ok) {
            const dbAdmins = await adminsRes.json();
            if (Array.isArray(dbAdmins)) {
              for (const k in registeredAdmins) delete registeredAdmins[k];
              dbAdmins.forEach(a => {
                const rollIdStr = a.rollId ? String(a.rollId) : (a.username ? String(a.username).toUpperCase() : 'ADMIN');
                const adminObj = {
                  username: a.username || rollIdStr.toLowerCase(),
                  password: a.password || '',
                  id: rollIdStr,
                  name: a.name || 'Administrator',
                  role: 'admin',
                  roleLabel: 'Exam Administrator',
                  email: a.email || '',
                  department: 'Academic Affairs & Examination Board',
                  avatar: ((a.name || 'AD').split(' ').map(n => n[0]).join('')).substring(0, 2).toUpperCase()
                };
                if (adminObj.username) registeredAdmins[String(adminObj.username).toLowerCase()] = adminObj;
                if (adminObj.id) {
                  registeredAdmins[String(adminObj.id).toLowerCase()] = adminObj;
                  registeredAdmins[String(adminObj.id).toUpperCase()] = adminObj;
                }
                if (adminObj.email) registeredAdmins[String(adminObj.email).toLowerCase()] = adminObj;
                if (adminObj.name) registeredAdmins[String(adminObj.name).toLowerCase()] = adminObj;
                if (a.id) registeredAdmins[String(a.id).toLowerCase()] = adminObj;
              });
              try {
                localStorage.setItem('online_exam_registered_admins', JSON.stringify(registeredAdmins));
              } catch (e) { }
            }
          }
        } catch (e) { }

        // 3. Fetch Quizzes from SQLite table 'quizzes' and bidirectionally sync
        let sqliteExamMap = {};
        try {
          const examsRes = await fetch('/api/exams');
          if (examsRes.ok) {
            const sqliteExams = await examsRes.json();
            if (Array.isArray(sqliteExams)) {
              sqliteExams.forEach(e => {
                sqliteExamMap[e.id] = e;
                const existingCreator = allExams[e.id] ? (allExams[e.id].created_by || allExams[e.id].admin_id) : null;
                allExams[e.id] = {
                  ...(allExams[e.id] || {}),
                  ...e,
                  created_by: e.created_by || existingCreator || null,
                  admin_id: e.created_by || existingCreator || null
                };
              });
              saveExamsToStorage();
            }
          }
        } catch (e) { }

        // Push any locally created subjects to SQLite online_exam.db
        try {
          for (const examId in allExams) {
            const localExam = allExams[examId];
            if (localExam && !sqliteExamMap[examId]) {
              fetch('/api/exams', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(localExam)
              }).catch(() => { });
            }
          }
        } catch (e) { }

        // 4. Fetch Questions from SQLite table 'questions' and bidirectionally sync
        let sqlitePoolMap = {};
        try {
          const qRes = await fetch('/api/questions');
          if (qRes.ok) {
            const sqlitePools = await qRes.json();
            if (sqlitePools && typeof sqlitePools === 'object' && Object.keys(sqlitePools).length > 0) {
              sqlitePoolMap = sqlitePools;
              for (const qid in sqlitePools) {
                masterQuestionPools[qid] = sqlitePools[qid];
              }
              saveQuestionPoolsToStorage();
              Object.keys(allExams).forEach(id => {
                rotateExamQuestions(id, true);
              });
            }
          }
        } catch (e) { }

        // Push any locally created question pools to SQLite
        try {
          for (const examId in masterQuestionPools) {
            const localQuestions = masterQuestionPools[examId];
            if (Array.isArray(localQuestions) && localQuestions.length > 0) {
              const remoteQuestions = sqlitePoolMap[examId] || [];
              if (remoteQuestions.length === 0) {
                for (const q of localQuestions) {
                  fetch('/api/questions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...q, quiz_id: examId })
                  }).catch(() => { });
                }
              }
            }
          }
        } catch (e) { }

        // Re-render active view if currently looking at dashboard
        const app = document.getElementById('appViewport');
        if (app && state.isAuthenticated) {
          if (state.currentView === 'dashboard') {
            renderDashboard(app);
          } else if (state.currentView === 'admin-dashboard') {
            renderAdminDashboard(app);
          }
        }

        // Update UI badge if visible
        const badge = document.getElementById('dbBadgeIndicator');
        if (badge) {
          badge.textContent = "🟢 SQLite 3 Active (online_exam.db)";
          badge.style.color = "#34d399";
        }
      } catch (err) {
        // Fallback to localStorage without interruption
        console.log("Operating in local offline storage mode.");
      }
    }

    function saveExamsToStorage() {
      try {
        localStorage.setItem('online_exam_all_exams', JSON.stringify(allExams));
      } catch (e) {
        console.warn("Could not save allExams to localStorage:", e);
      }
    }

    function saveQuestionPoolsToStorage() {
      try {
        localStorage.setItem('online_exam_master_pools', JSON.stringify(masterQuestionPools));
      } catch (e) {
        console.warn("Could not save masterQuestionPools to localStorage:", e);
      }
    }

    // Load custom registered accounts and persisted exams from localStorage if present
    try {
      const demoKeys = ['alice', 'bob', 'adm101', 'adm202', 'student', 'admin', 'stu1001'];
      const isDemoAccount = (ident) => {
        if (!ident) return false;
        return demoKeys.includes(ident.toString().toLowerCase());
      };
      const purgeDemoFromObj = (obj) => {
        if (!obj || typeof obj !== 'object') return obj;
        for (const k of Object.keys(obj)) {
          const lowerK = k.toLowerCase();
          const item = obj[k];
          const itemU = item && (item.username || '').toLowerCase();
          const itemId = item && String(item.id || item.specific_id || item.rollId || '').toLowerCase();
          if (demoKeys.includes(lowerK) || demoKeys.includes(itemU) || demoKeys.includes(itemId)) {
            delete obj[k];
          }
        }
        return obj;
      };

      // Clean remembered logins or active sessions if currently a demo user
      ['online_exam_saved_admin_login', 'online_exam_saved_student_login', 'online_exam_active_user', 'online_exam_session_user'].forEach(key => {
        try {
          const val = localStorage.getItem(key);
          if (val) {
            const p = JSON.parse(val);
            if (isDemoAccount(p.username) || isDemoAccount(p.id) || isDemoAccount(p.identifier) || isDemoAccount(p.specific_id)) {
              localStorage.removeItem(key);
            }
          }
        } catch (e) { }
      });

      const savedStudents = localStorage.getItem('online_exam_registered_students');
      if (savedStudents) {
        const parsed = purgeDemoFromObj(JSON.parse(savedStudents));
        Object.assign(registeredCandidates, parsed);
      }
      const savedAdmins = localStorage.getItem('online_exam_registered_admins');
      if (savedAdmins) {
        const parsedAdmin = purgeDemoFromObj(JSON.parse(savedAdmins));
        Object.assign(registeredAdmins, parsedAdmin);
      }
      try {
        localStorage.setItem('online_exam_registered_students', JSON.stringify(registeredCandidates));
        localStorage.setItem('online_exam_registered_admins', JSON.stringify(registeredAdmins));
      } catch (e) { }

      // Reset state if active session was a demo user
      if (state.user && (isDemoAccount(state.user.username) || isDemoAccount(state.user.id))) {
        state.isAuthenticated = false;
        state.user = null;
        state.currentView = 'auth';
      }

      // Persist examinations state across browser refreshes
      const savedExams = localStorage.getItem('online_exam_all_exams');
      if (savedExams !== null) {
        try {
          const parsedExams = JSON.parse(savedExams);
          for (const k in allExams) delete allExams[k];
          Object.assign(allExams, parsedExams);
        } catch (e) { }
      }
      const savedPools = localStorage.getItem('online_exam_master_pools');
      if (savedPools !== null) {
        try {
          const parsedPools = JSON.parse(savedPools);
          for (const k in masterQuestionPools) delete masterQuestionPools[k];
          Object.assign(masterQuestionPools, parsedPools);
        } catch (e) { }
      }
      // Apply permanently deleted exams list only to unowned demo exams
      let deletedExamIds = [];
      try {
        deletedExamIds = JSON.parse(localStorage.getItem('online_exam_deleted_exam_ids') || '[]');
      } catch (e) { }
      if (Array.isArray(deletedExamIds)) {
        // Guarantee OOP is never pruned by legacy deleted list
        deletedExamIds = deletedExamIds.filter(id => id !== 'OOP');
        try { localStorage.setItem('online_exam_deleted_exam_ids', JSON.stringify(deletedExamIds)); } catch (e) { }
        deletedExamIds.forEach(id => {
          if (allExams[id] && !allExams[id].created_by && !allExams[id].admin_id) {
            delete allExams[id];
            delete masterQuestionPools[id];
          }
        });
      }
      // Ensure the 4 legacy demo subjects are expunged from localStorage permanently IF unowned
      ['EX-101', 'EX-102', 'EX-103', 'EX-100'].forEach(id => {
        if (allExams[id] && !allExams[id].created_by && !allExams[id].admin_id) {
          delete allExams[id];
          delete masterQuestionPools[id];
        }
      });

      // Guarantee the OOP exam and its 20 questions are always populated
      if (!allExams['OOP'] || Object.keys(allExams).length === 0) {
        allExams['OOP'] = {

      saveExamsToStorage();

      const currentAdminEmail = (state.user.email || '').toString().toLowerCase();
      const currentAdminName = (state.user.name || '').toString().toLowerCase();

      const adminIdentifiers = new Set([
        currentAdminId,
        currentAdminSpecificId,
        currentAdminUser,
        currentAdminEmail,
        currentAdminName
      ].filter(Boolean));

      const creators = [
        exam.created_by,
        exam.creator_id,

      ].filter(Boolean).map(c => c.toString().toLowerCase());

    }

    /**
     * Dynamically draws a fresh, randomized permutation of 20 questions from
     * the subject question bank and shuffles choice options for repeat attempts.
     */
    function rotateExamQuestions(examId, isInitial = false) {
      const pool = masterQuestionPools[examId];
      if (!pool || pool.length === 0) {
        if (allExams[examId]) {
          allExams[examId].questions = [];
          allExams[examId].totalQuestions = 0;
        }
        return;
      }

      // Draw up to 20 questions or total available in pool
      const maxDraw = Math.min(20, pool.length);
      const copy = [...pool];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }

      const selected = copy.slice(0, maxDraw).map((item, idx) => {
        const itemOptions = Array.isArray(item.options) ? item.options : ['', '', '', ''];
        const originalCorrectOption = itemOptions[item.correct || 0] || itemOptions[0];
        const shuffledOpts = [...itemOptions];
        for (let i = shuffledOpts.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffledOpts[i], shuffledOpts[j]] = [shuffledOpts[j], shuffledOpts[i]];
        }
        const newCorrect = Math.max(0, shuffledOpts.indexOf(originalCorrectOption));
        return {
          text: `${idx + 1}. ${(item.text || '').replace(/^\d+\.\s*/, '')}`,
          options: shuffledOpts,
          correct: newCorrect,
          marks: item.marks || 5,
          explanation: item.explanation || ''
        };
      });

      allExams[examId].questions = selected;
      allExams[examId].totalQuestions = selected.length;
      if (typeof state !== 'undefined' && state) {
        state.examAttempts = state.examAttempts || {};
        if (isInitial || !state.examAttempts[examId]) {
          state.examAttempts[examId] = 1;
        } else {
          state.examAttempts[examId] = state.examAttempts[examId] + 1;
        }
        state.answers = state.answers || {};
        state.answers[examId] = {};
        state.remainingSeconds = state.remainingSeconds || {};
        state.remainingSeconds[examId] = allExams[examId].durationMinutes * 60;
      }
    }

    // Populate initial randomized question sets for all examinations
    Object.keys(allExams).forEach(id => {
      rotateExamQuestions(id, true);
    });

    async function handleVerifyAdmin(event) {
      if (event) event.preventDefault();
      const staffInput = document.getElementById('recoverAdminStaffId');
      const emailInput = document.getElementById('recoverAdminEmail');
      const staffVal = staffInput ? staffInput.value.trim().toLowerCase() : '';
      const emailVal = emailInput ? emailInput.value.trim().toLowerCase() : '';

      if (!staffVal) {
        showToastNotification("⚠️ Please enter your administrator Staff ID or username.");
        if (staffInput) staffInput.focus();
        return;
      }
      if (!emailVal) {
        showToastNotification("⚠️ Please enter your registered email address.");
        if (emailInput) emailInput.focus();
        return;
      }

      // 1. Check in-memory / localStorage registered administrators
      let matchedKey = null;
      let matchedName = '';
      for (const [k, a] of Object.entries(registeredAdmins)) {
        if (!a) continue;
        const aId = String(a.id || '').toLowerCase();
        const aName = (a.username || '').toLowerCase();
        const aEmail = (a.email || '').toLowerCase();
        if ((aId === staffVal || aName === staffVal) && aEmail === emailVal) {
          matchedKey = k;
          matchedName = a.name || a.id;
          break;
        }
      }

      // 2. Also check SQLite 3 database via backend API
      try {
        const res = await fetch('/api/verify-admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: staffVal, email: emailVal })
        });
        if (res.ok) {
          const data = await res.json();
          if (data && data.verified) {
            matchedKey = matchedKey || data.username || staffVal;
            matchedName = matchedName || data.full_name || data.admin_id;
          }
        }
      } catch (err) {
        // Local/offline fallback
      }

      if (!matchedKey) {
        showToastNotification("❌ Account verification failed. No administrator account matched the provided details.");
        return;
      }

      state.verifiedAdminKey = matchedKey;
      state.verifiedAdminName = matchedName || staffVal.toUpperCase();
      state.adminForgotStep = 2;

      renderAuthView(document.getElementById('appViewport'));
      showToastNotification("✓ Administrator account verified! Please set your new password.");
    }

    async function handleResetAdminPassword(event) {
      if (event) event.preventDefault();
      const p1 = document.getElementById('newAdminPassword');
      const p2 = document.getElementById('confirmAdminPassword');
      const pwd1 = p1 ? p1.value : '';
      const pwd2 = p2 ? p2.value : '';

      if (!pwd1) {
        showToastNotification("⚠️ Please enter a new password.");
        if (p1) p1.focus();
        return;
      }
      if (pwd1.length < 6) {
        showToastNotification("⚠️ Password must be at least 6 characters long.");
        if (p1) p1.focus();
        return;
      }
      if (pwd1 !== pwd2) {
        showToastNotification("❌ Passwords do not match. Please re-enter.");
        if (p2) p2.focus();
        return;
      }

      const key = state.verifiedAdminKey;
      if (!key) {
        showToastNotification("⚠️ Verification session expired. Please verify your account again.");
        openAdminForgotPassword();
        return;
      }

      // 1. Update in registeredAdmins
      if (registeredAdmins[key]) {
        registeredAdmins[key].password = pwd1;
      }
      for (const [k, a] of Object.entries(registeredAdmins)) {
        if (!a) continue;
        if (a === registeredAdmins[key] ||
            (a.id && String(a.id).toLowerCase() === String(key).toLowerCase()) ||
            (a.username && a.username.toLowerCase() === key.toLowerCase())) {
          a.password = pwd1;
        }
      }
      try {
        localStorage.setItem('online_exam_registered_admins', JSON.stringify(registeredAdmins));
      } catch (e) { }

      // 2. Synchronize new password with SQLite 3 database
      try {
        fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: key, new_password: pwd1, role: 'admin' })
        }).catch(() => { });
      } catch (err) { }

      state.adminForgotStep = 1;
      state.verifiedAdminKey = null;
      state.verifiedAdminName = '';

      showToastNotification("✓ Administrator password reset successfully! You can now sign in with your new password.");

        if (uField) {
          uField.value = key;
          const pField = document.getElementById('authAdminPassword');
          if (pField) pField.focus();
        }
      }, 100);
    }

    function getUniqueRegisteredStudents() {
      const map = new Map();
      for (const u of Object.values(registeredCandidates)) {
        if (!u) continue;
        const rawKey = u.rollId || u.username || u.id || '';
        const key = String(rawKey).toLowerCase();
        if (key && !map.has(key)) {
          map.set(key, u);
        }
      }
      return Array.from(map.values());
    }

    function getSavedAccountsForRole(role) {
      const accounts = [];
      const seen = new Set();

      if (role === 'admin') {
        // 1. Check remembered admin session login
        try {
          const rem = localStorage.getItem('online_exam_saved_admin_login');
          if (rem) {
            const p = JSON.parse(rem);
            const k = String(p.identifier || p.username || p.id || '').toLowerCase();
            if (k && !seen.has(k)) {
              seen.add(k);
              accounts.push({
                identifier: p.identifier || p.username || p.id,
                password: p.password || '',
                name: p.name || p.identifier,
                id: p.id || p.identifier,
                email: p.email || '',
                roleLabel: 'Remembered Administrator',
                isRemembered: true
              });
            }
          }
        } catch (e) { }

        // 2. Check registeredAdmins
        for (const [k, a] of Object.entries(registeredAdmins)) {
          if (!a) continue;
          const ident = a.username || a.id || k;
          const keyLower = String(ident).toLowerCase();
          if (!seen.has(keyLower)) {
            seen.add(keyLower);
            accounts.push({
              identifier: ident,
              password: a.password || '',
              name: a.name || ident,
              id: a.id || ident,
              email: a.email || '',
              roleLabel: a.roleLabel || 'Registered Administrator',
              isRemembered: false
            });
          }
        }
      } else {
        // 1. Check remembered student session login
        try {
          const rem = localStorage.getItem('online_exam_saved_student_login');
          if (rem) {
            const p = JSON.parse(rem);
            const k = String(p.identifier || p.username || p.id || '').toLowerCase();
            if (k && !seen.has(k)) {
              seen.add(k);
              accounts.push({
                identifier: p.identifier || p.username || p.id,
                password: p.password || '',
                name: p.name || p.identifier,
                id: p.id || p.identifier,
                email: p.email || '',
                roleLabel: 'Remembered Student',
                isRemembered: true
              });
            }
          }
        } catch (e) { }

        // 2. Check registeredCandidates
        for (const [k, c] of Object.entries(registeredCandidates)) {
          if (!c) continue;
          const ident = c.username || c.id || k;
          const keyLower = String(ident).toLowerCase();
          if (!seen.has(keyLower)) {
            seen.add(keyLower);
            accounts.push({
              identifier: ident,
              password: c.password || '',
              name: c.name || ident,
              id: c.id || ident,
              email: c.email || '',
              roleLabel: c.roleLabel || 'Registered Candidate',
              isRemembered: false
            });
          }
        }
      }
      return accounts;
    }

        const u = document.getElementById('authAdminUsername');
        const p = document.getElementById('authAdminPassword');
        if (u) {
          unlockAuthInput(u);
          u.value = identifier;
        }
        if (p && password) {
          unlockAuthInput(p);
          p.value = password;
        }
      } else {
        const u = document.getElementById('authUsername');
        const p = document.getElementById('authPassword');
        if (u) {
          unlockAuthInput(u);
          u.value = identifier;
        }
        if (p && password) {
          unlockAuthInput(p);
          p.value = password;
        }

    function handleLoginSubmit(event) {
      if (event) event.preventDefault();
      const userField = document.getElementById('authUsername');
      const pwdField = document.getElementById('authPassword');
      const usernameInput = userField ? userField.value.trim().toLowerCase() : '';
      const passwordInput = pwdField ? pwdField.value : '';

      if (!usernameInput) {
        showToastNotification("⚠️ Please enter your student username, Roll ID, or email.");
        if (userField) userField.focus();
        return;
      }

      if (!passwordInput) {
        showToastNotification("⚠️ Please enter your student password.");
        if (pwdField) pwdField.focus();
        return;
      }

      // Proactive redirection if admin credentials entered on student form
      if (registeredAdmins[usernameInput] && !registeredCandidates[usernameInput]) {
        showToastNotification("💡 Administrator Account Detected: Redirecting to Administrator Sign In tab.");
        switchAuthTab('admin');
        setTimeout(() => {
          const aField = document.getElementById('authAdminUsername');
          const aPwd = document.getElementById('authAdminPassword');
          if (aField) aField.value = usernameInput;
          if (aPwd) aPwd.value = passwordInput;
        }, 50);
        return;
      }

      // Find user by username, ID (e.g. STU1001), or email
      const authenticatedUser = registeredCandidates[usernameInput] ||
        Object.values(registeredCandidates).find(u =>
          (u.username && u.username.toLowerCase() === usernameInput) ||
          (u.id && String(u.id).toLowerCase() === usernameInput) ||
          (u.email && u.email.toLowerCase() === usernameInput)
        );

      if (!authenticatedUser) {
        showToastNotification("⚠️ Candidate account not found. Please click 'Sign Up' below to create your account.");
        if (userField) userField.focus();
        return;
      }

      const cleanPwd = passwordInput ? passwordInput.trim() : '';
      if (authenticatedUser.password !== cleanPwd) {
        showToastNotification("❌ Incorrect password. Please try again.");
        if (pwdField) pwdField.focus();
        return;
      }

      loginUser(authenticatedUser);
    }

    function handleAdminLoginSubmit(event) {
      if (event) event.preventDefault();
      const userField = document.getElementById('authAdminUsername');
      const pwdField = document.getElementById('authAdminPassword');
      const usernameInput = userField ? userField.value.trim().toLowerCase() : '';
      const passwordInput = pwdField ? pwdField.value : '';

      if (!usernameInput) {
        showToastNotification("⚠️ Please enter your administrator username or Staff ID.");
        if (userField) userField.focus();
        return;
      }

      if (!passwordInput) {
        showToastNotification("⚠️ Please enter your administrator password.");
        if (pwdField) pwdField.focus();
        return;
      }

      // Strict role enforcement: Students blocked from administrator console
      if (registeredCandidates[usernameInput] && !registeredAdmins[usernameInput]) {
        showToastNotification(`⛔ Access Denied: The account '${usernameInput}' is a Student account and lacks administrative privileges. Please use the Student Sign In tab.`);
        return;
      }

      // Check registeredAdmins by username, staff ID (e.g. ADM001), email, or name
      const matchedAdmin = registeredAdmins[usernameInput] ||
        Object.values(registeredAdmins).find(a =>
          (a.username && a.username.toLowerCase() === usernameInput) ||
          (a.id && String(a.id).toLowerCase() === usernameInput) ||
          (a.email && a.email.toLowerCase() === usernameInput) ||
          (a.name && a.name.toLowerCase() === usernameInput)
        );

      if (!matchedAdmin) {
        showToastNotification("⚠️ Administrator account not found. Please click 'Sign Up' below to create an administrator account.");
        if (userField) userField.focus();
        return;
      }

      const cleanAdminPwd = passwordInput ? passwordInput.trim() : '';
      if (matchedAdmin.password !== cleanAdminPwd) {
        showToastNotification("❌ Incorrect administrator password. Please try again.");
        if (pwdField) pwdField.focus();
        return;
      }

      loginUser(matchedAdmin);
    }

    function loginUser(userData) {
      state.user = { ...userData };
      state.isAuthenticated = true;
      if (userData.role === 'admin') {
        state.adminActiveTab = 'quizzes';
      }
      state.adminSelectedExam = '';
      try {
        localStorage.setItem('online_exam_active_user', JSON.stringify(userData));
      } catch (e) { }
      updateNavbarUserInfo();
      if (typeof renderSidebarNavigation === 'function') {
        renderSidebarNavigation();
      }
      showToastNotification(`✓ Authenticated: Welcome, ${userData.name}! Logged in as ${userData.roleLabel}.`);
      if (userData.role === 'admin') {
        showView('admin-dashboard');
      } else {
        showView('dashboard');
      }
    }

    function handleRegisterSubmit(event) {
      if (event) event.preventDefault();
      const role = state.regRole || 'student';
      const name = document.getElementById('regName').value.trim() || (role === 'admin' ? 'Administrator' : 'New Student');
      const regId = document.getElementById('regId').value.trim() || (role === 'admin' ? 'ADM' + Math.floor(100 + Math.random() * 900) : 'STU' + Math.floor(1000 + Math.random() * 9000));
      const email = document.getElementById('regEmail').value.trim() || (regId.toLowerCase() + (role === 'admin' ? '@examportal.edu' : '@student.edu'));
      const programOrDept = document.getElementById('regProgram').value.trim() || (role === 'admin' ? 'Academic Affairs & Examination Board' : 'Master of Computer Applications (MCA)');
      const pwd = document.getElementById('regPwd').value;
      const pwdConf = document.getElementById('regPwdConf').value;

      if (!pwd) {
        showToastNotification("⚠️ Please choose a password for your account.");
        return;
      }

      if (pwd.length < 6) {
        showToastNotification("⚠️ Password must be at least 6 characters long.");
        return;
      }

      if (pwd !== pwdConf) {
        showToastNotification("⚠️ Passwords do not match. Please re-enter.");
        return;
      }

      const initials = name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() || (role === 'admin' ? 'AD' : 'ST');

      if (role === 'admin') {
        const newAdmin = {
          username: regId.toLowerCase(),
          password: pwd,
          id: regId.toUpperCase(),
          name: name,
          role: "admin",
          roleLabel: "Exam Administrator",
          email: email,
          department: programOrDept,
          avatar: initials
        };
        registeredAdmins[regId.toLowerCase()] = newAdmin;
        registeredAdmins[regId.toUpperCase()] = newAdmin;
        if (email) registeredAdmins[email.toLowerCase()] = newAdmin;
        try {
          localStorage.setItem('online_exam_registered_admins', JSON.stringify(registeredAdmins));
        } catch (e) { }
        // Synchronize with SQLite 3 users table
        try {
          fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newAdmin)
          }).catch(() => { });
        } catch (e) { }

        loginUser(newAdmin);
        showToastNotification(`🛡️ Administrator account '${regId.toUpperCase()}' registered successfully! Welcome to Admin Dashboard.`);
      } else {
        const newUser = {
          username: regId.toLowerCase(),
          password: pwd,
          id: regId.toUpperCase(),
          name: name,
          role: "student",
          roleLabel: "Registered Candidate",
          email: email,
          program: programOrDept,
          semester: "1st Semester",
          avatar: initials
        };
        registeredCandidates[regId.toLowerCase()] = newUser;
        registeredCandidates[regId.toUpperCase()] = newUser;
        if (email) registeredCandidates[email.toLowerCase()] = newUser;
        try {
          localStorage.setItem('online_exam_registered_students', JSON.stringify(registeredCandidates));
        } catch (e) { }
        // Synchronize with SQLite 3 users table
        try {
          fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newUser)
          }).catch(() => { });
        } catch (e) { }

        loginUser(newUser);
        showToastNotification(`🎓 Student candidate '${regId.toUpperCase()}' registered successfully! Welcome to Examination Portal.`);
      }
    }

      }

      const creatorId = state.user ? (state.user.id || state.user.specific_id || state.user.username) : 'ADMIN';
      const creatorUser = state.user ? (state.user.username || '') : '';
      const marksVal = parseInt(document.getElementById('newQuizMarks').value) || 100;

      allExams[code] = {
        id: code,
        title: title,

    function handleAddQuestionSubmit(event) {

      const opt0 = (document.getElementById('newQOpt0').value || '').trim();
      const opt1 = (document.getElementById('newQOpt1').value || '').trim();
      const opt2 = (document.getElementById('newQOpt2').value || '').trim();
      const opt3 = (document.getElementById('newQOpt3').value || '').trim();
      const correct = parseInt(document.getElementById('newQCorrect').value, 10);
      const marks = parseInt(document.getElementById('newQMarks').value, 10) || 5;

      if (!text || !opt0 || !opt1 || !opt2 || !opt3) {
        showToastNotification("⚠️ Please fill in all question prompt and option fields.");

        options: [opt0, opt1, opt2, opt3],

      };

        allExams[examId].totalQuestions = masterQuestionPools[examId].length;
        rotateExamQuestions(examId, true);
